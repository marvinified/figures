<script>
(() => {
/**
 * toolbox: a cantilever toolbox, a bin, two open trays with their
 * compartments, and a lid with its handle. At rest it stands a little open, the first
 * tray bright. The pointer's screen x opens it, on a spring: each layer rides
 * out over the one below and rises, a staircase that stays centred. Its screen y
 * picks a layer, by bands taken from the resting pose, and that layer takes
 * the bright edge. The slider is how far a layer rides out.
 */
const {
  Cam, clamp, facing, fit, poly, prism, proj, rings, rrect, seg, spring, stepS,
  mk, pointer, put, register, disposer, solid,
} = HL;

const W = 62, D = 32, O0 = 0.3, RISE = 9;
const LAYERS = [["bin", 0, 18], ["tray 1", 18, 25], ["tray 2", 25, 32], ["lid", 32, 36]];

function mount({ stage, svg, read }, value) {
  const bag = disposer();
  let SH = value, pick = -1;

  const C = Cam(45, 0.5, 2.7);
  const E = 1.5 * 26;
  fit(C, [[-E, 0, 0], [W + E, D, 0], [W + E, 0, 0], [-E, D, 0], [-E, 0, 40 + 3 * RISE], [W + E, 0, 40 + 3 * RISE]], 200, 166);
  const P = proj(C), front = facing(C);

  const g = mk("g", {}, svg);

  const layers = LAYERS.map(([name, z0, z1], k) => {
    const el = solid(g);
    return { k, name, z0, z1, el, top: mk("path", { class: "nf lo" }, el.g), handle: k === 3 ? solid(el.g) : null };
  });
  const sp = spring(O0, { eps: 0.001 });
  let drawn = NaN;

  function draw() {
    const o = clamp(sp.x, 0, 1);
    if (o === drawn) return;
    drawn = o;
    // the staircase stays centred: the bin slides back as the lid rides out
    const at = (k) => [(k - 1.5) * o * SH, k * o * RISE];
    layers.forEach((L) => {
      const [dx, dz] = at(L.k), [ring, inner] = rings(dx, 0, dx + W, D, 4, 1.4), zt = L.z1 + dz;
      put(L.el, prism(P, front, ring, inner, L.z0 + dz, zt));
      const on = (r) => poly(r.map((q) => P(q.u, q.v, zt)));
      if (L.handle) {
        const [hr, hi] = rings(dx + W / 2 - 13, D / 2 - 2.2, dx + W / 2 + 13, D / 2 + 2.2, 2.2, 0.7);
        put(L.handle, prism(P, front, hr, hi, zt, zt + 4));
        L.top.setAttribute("d", "");
      } else {
        // an open tray: its rim and the walls between its compartments
        const rim = on(rrect(dx + 3, 3, dx + W - 3, D - 3, 2.5, 4));
        const walls = L.k === 0 ? seg(P(dx + W * 0.4, 3, zt), P(dx + W * 0.4, D - 3, zt)) : seg(P(dx + W / 3, 3, zt), P(dx + W / 3, D - 3, zt)) + seg(P(dx + (2 * W) / 3, 3, zt), P(dx + (2 * W) / 3, D - 3, zt));
        L.top.setAttribute("d", rim + walls);
      }
    });
  }

  const B = register(stage, (dt) => { const m = stepS(sp, dt); draw(); return m; });
  bag.add(B.unregister);

  // the open-ness from screen x, and the layer from screen y in bands taken at rest
  const sx0 = P(-E * 0.6, D / 2, 0)[0], sx1 = P(W + E * 0.6, D / 2, 0)[0];
  const band = layers.map((L) => P(W / 2 + (L.k - 1.5) * O0 * 19, D, (L.z0 + L.z1) / 2 + L.k * O0 * RISE)[1]);
  function choose([sx, sy]) {
    let best = 0;
    band.forEach((y, k) => { if (Math.abs(sy - y) < Math.abs(sy - band[best])) best = k; });
    return best;
  }
  function highlight() {
    layers.forEach((L) => L.el.sil.classList.toggle("hi", pick < 0 ? L.k === 1 : L.k === pick));
  }

  highlight();
  bag.add(pointer(stage, {
    move: (p) => {
      sp.t = clamp((p[0] - sx0) / (sx1 - sx0), 0, 1);
      const k = choose(p);
      if (k !== pick) { pick = k; highlight(); }
      read.textContent = layers[pick].name;
      B.wake();
    },
    leave: () => { sp.t = O0; pick = -1; highlight(); read.textContent = "rest"; B.wake(); },
  }));
  bag.add(() => svg.replaceChildren());

  return {
    set: (v) => { SH = v; drawn = NaN; B.wake(); },
    destroy: bag.dispose,
  };
}

hairline({
  name: "toolbox",
  means: "A cantilever toolbox: the pointer opens it into a staircase of trays and picks the one to reach into.",
  rules: [1, 3, 5, 9],
  range: [12, 19, 26],
  mount,
});
})();
</script>
<script>
(() => {
/**
 * piano-keys: a keyboard of ten white keys and their black keys in twos and
 * threes, between two cheek blocks and under a back rail. The pointer picks a
 * key (black keys tested on their resting tops first, then white); that key's
 * major chord goes down as an arpeggio, root first, and the root takes the
 * bright edge. Notes past the top fold down an octave. At rest a C chord is
 * held. The slider is the arpeggio's step, in ms.
 */
const {
  Cam, clamp, facing, fit, prism, proj, rings, unproj,
  tween, tset, tval, tdone, mk, pointer, put, register, disposer, solid,
} = HL;

const NW = 10, W = 11, L = 58, ZW = 8, BW = 6, BL = 36, ZB = 12.5, DIP = 5.5, TOP = 14;
const WHITE = [0, 2, 4, 5, 7, 9, 11], NAMES = ["C", "C♯", "D", "E♭", "E", "F", "F♯", "G", "A♭", "A", "B♭", "B"];
const X1 = NW * W;

/** The keys, each with its semitone: whites along x, blacks over the gaps after C, D, F, G and A. */
function keyboard() {
  const keys = [];
  for (let i = 0; i < NW; i++) keys.push({ s: WHITE[i % 7] + 12 * Math.floor(i / 7), black: false, x0: i * W + 0.6, x1: (i + 1) * W - 0.6, y1: L, z1: ZW });
  for (let i = 0; i < NW - 1; i++) {
    if (![0, 1, 3, 4, 5].includes(i % 7)) continue;
    const xb = (i + 1) * W;
    keys.push({ s: WHITE[i % 7] + 1 + 12 * Math.floor(i / 7), black: true, x0: xb - BW / 2, x1: xb + BW / 2, y1: BL, z0: ZW, z1: ZB });
  }
  return keys;
}

/** The chord on semitone s: root, third, fifth, a note past the top folded down an octave. */
const chord = (s, top) => [s, s + 4, s + 7].map((n) => (n > top ? n - 12 : n));

function mount({ stage, svg, read }, value) {
  const bag = disposer();
  let stag = value, root = -1;

  const C = Cam(45, 0.5, 2.02);
  fit(C, [[-9, -13, -6], [X1 + 9, L + 3, -6], [X1 + 9, -13, -6], [-9, L + 3, -6], [-9, -13, TOP], [X1 + 9, -13, TOP]], 200, 166);
  const P = proj(C), front = facing(C);
  const block = (parent, x0, y0, x1, y1, r, b, z0, z1) => { const [ring, inner] = rings(x0, y0, x1, y1, r, b); put(solid(parent), prism(P, front, ring, inner, z0, z1)); };

  const g = mk("g", {}, svg);
  block(g, -9, -13, X1 + 9, L + 3, 4, 1.6, -6, 0);
  block(g, -9, -13, X1 + 9, -1.5, 3, 1.4, 0, TOP);
  block(g, -9, -1.5, -1, L + 3, 2.6, 1.2, 0, ZW + 3);

  const keys = keyboard(), topS = Math.max(...keys.map((k) => k.s));
  keys.forEach((k) => {
    [k.ring, k.inner] = rings(k.x0, 0, k.x1, k.y1, k.black ? 1.3 : 1.5, k.black ? 0.8 : 1);
    k.el = solid(g); k.d = tween(0); k.drawn = NaN;
  });
  block(g, X1 + 1, -1.5, X1 + 9, L + 3, 2.6, 1.2, 0, ZW + 3);
  function draw(k, d) {
    if (d === k.drawn) return;
    k.drawn = d;
    put(k.el, prism(P, front, k.ring, k.inner, k.black ? k.z0 : 0, k.z1 - d));
  }

  const B = register(stage, (_dt, now) => {
    let moving = false;
    for (const k of keys) { draw(k, tval(k.d, now)); if (!tdone(k.d, now)) moving = true; }
    return moving;
  });
  bag.add(B.unregister);

  /** Black keys on their resting tops first, as they stand above the whites; then the white keys. */
  function hit([sx, sy]) {
    const [bx, by] = unproj(C, sx, sy, ZB);
    for (const k of keys) if (k.black && bx >= k.x0 - 0.6 && bx <= k.x1 + 0.6 && by >= 0 && by <= BL) return k.s;
    const [x, y] = unproj(C, sx, sy, ZW);
    if (y < -1 || y > L + 2 || x < 0 || x >= X1) return -1;
    return keys[clamp(Math.floor(x / W), 0, NW - 1)].s;
  }

  function play(s) {
    const now = performance.now(), notes = chord(s < 0 ? 0 : s, topS);
    keys.forEach((k) => {
      const at = notes.indexOf(k.s);
      tset(k.d, at < 0 ? 0 : DIP, now, at < 0 ? 0 : at * stag);
      k.el.sil.classList.toggle("hi", k.s === notes[0]);
    });
    read.textContent = s < 0 ? "rest" : `${NAMES[s % 12]} maj`;
    B.wake();
  }
  function setRoot(s) { if (s !== root) { root = s; play(s); } }

  play(-1);
  bag.add(pointer(stage, { move: (p) => setRoot(hit(p)), leave: () => setRoot(-1) }));
  bag.add(() => svg.replaceChildren());

  return {
    set: (v) => { stag = v; },
    destroy: bag.dispose,
  };
}

hairline({
  name: "piano-keys",
  means: "A keyboard: the key under the pointer plays its major chord, the three keys going down one after another.",
  rules: [1, 2, 8, 10],
  range: [0, 70, 140],
  mount,
});
})();
</script>
<script>
(() => {
/**
 * solar-panels: twelve panels on posts over a gravel pad, each a framed plate
 * ruled into cells. The pointer is the sun: put back on the plane of the
 * pivots, it stands a fixed height above that point, and every panel tilts to
 * face it on its own springs, the one under it lying flat and the far ones
 * tipped toward it, as far as the slider lets them. At rest the sun is low in
 * the near corner and the panel nearest it is bright. The slider is the tilt.
 */
const {
  Cam, clamp, fit, hull, open, poly, prism, proj, rings, rrect, run, seg, unproj, facing,
  spring, stepS, mk, pointer, put, register, disposer, solid,
} = HL;

const NX = 4, NY = 3, PX = 40, PY = 30, W = 30, D = 18, T = 1.6, HP = 17, HS = 46;
const X1 = NX * PX, Y1 = NY * PY, SUN0 = [X1 + 4, Y1 + 22];

/** The direction toward the camera, from what P does to the three axes. */
function viewDir(P) {
  const o = P(0, 0, 0), e = [P(1, 0, 0), P(0, 1, 0), P(0, 0, 1)].map((p) => [p[0] - o[0], p[1] - o[1]]);
  const a = e.map((v) => v[0]), b = e.map((v) => v[1]);
  const v = [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]];
  return v[2] < 0 ? v.map((c) => -c) : v;
}

/** A rounded slab: ring and inner in its own (u, v), T thick; at(u, v, t) places it. The crease is the near face's inner run that borders a side. */
function slab(P, V, at, ring, inner, T) {
  const w = (q, t) => P(...at(q.u, q.v, t)), a = at(0, 0, 0), b = at(0, 0, T);
  const tn = (b[0] - a[0]) * V[0] + (b[1] - a[1]) * V[1] + (b[2] - a[2]) * V[2] > 0 ? T : 0, tf = T - tn;
  const n0 = P(...at(0, 0, tn)), f0 = P(...at(0, 0, tf)), o = [f0[0] - n0[0], f0[1] - n0[1]];
  const keep = (q) => { const p = w(q, tn), s = P(...at(q.u + q.nu, q.v + q.nv, tn)); return (s[0] - p[0]) * o[0] + (s[1] - p[1]) * o[1] > 0.01; };
  const r = Math.hypot(o[0], o[1]) > 0.2 ? run(inner, keep) : [];
  return { sil: poly(hull(ring.map((q) => w(q, tn)).concat(ring.map((q) => w(q, tf))))), crease: r.length > 1 ? open(r.map((q) => w(q, tn))) : "", tn };
}

/** A panel's frame, from the slope (gx, gy) its normal leans by: across, up-slope, and the normal. */
function frame(gx, gy) {
  const nl = Math.hypot(gx, gy, 1), n = [gx / nl, gy / nl, 1 / nl];
  const al = Math.hypot(1, gx), a = [1 / al, 0, -gx / al];
  const b = [n[1] * a[2] - n[2] * a[1], n[2] * a[0] - n[0] * a[2], n[0] * a[1] - n[1] * a[0]];
  return { a, b, n };
}

function mount({ stage, svg, read }, value) {
  const bag = disposer();
  let maxG = Math.tan((value * Math.PI) / 180), sun = SUN0, pick = -1;

  const C = Cam(45, 0.5, 1.72);
  fit(C, [[-10, -10, -4], [X1 + 10, Y1 + 10, -4], [X1 + 10, -10, -4], [-10, Y1 + 10, -4], [PX / 2, PY / 2, HP + 16], [X1 - PX / 2, PY / 2, HP + 16]], 200, 172);
  const P = proj(C), V = viewDir(P), front = facing(C);
  const ring = rrect(-W / 2, -D / 2, W / 2, D / 2, 2.2, 4), inner = rrect(-W / 2 + 1.2, -D / 2 + 1.2, W / 2 - 1.2, D / 2 - 1.2, 1.2, 4);

  const g = mk("g", {}, svg);
  const [pr, pi] = rings(-10, -10, X1 + 10, Y1 + 10, 10, 2.2);
  put(solid(g), prism(P, front, pr, pi, -4, 0));

  const panels = [];
  for (let s = 0; s <= NX + NY - 2; s++) for (let i = 0; i < NX; i++) {
    const j = s - i;
    if (j < 0 || j >= NY) continue;
    const cx = (i + 0.5) * PX, cy = (j + 0.5) * PY, grp = mk("g", {}, g);
    const [qr, qi] = rings(cx - 1.7, cy - 1.7, cx + 1.7, cy + 1.7, 1.7, 0.6);
    put(solid(grp), prism(P, front, qr, qi, 0, HP - 0.5));
    const el = solid(grp), cells = mk("path", { class: "nf lo" }, el.g);
    panels.push({ i, j, cx, cy, el, cells, gx: spring(0, { eps: 0.002 }), gy: spring(0, { eps: 0.002 }), drawn: "" });
  }

  function draw(p) {
    const key = p.gx.x.toFixed(4) + "," + p.gy.x.toFixed(4);
    if (key === p.drawn) return;
    p.drawn = key;
    const { a, b, n } = frame(p.gx.x, p.gy.x);
    const at = (u, v, t) => [p.cx + u * a[0] + v * b[0] + t * n[0], p.cy + u * a[1] + v * b[1] + t * n[1], HP + u * a[2] + v * b[2] + t * n[2]];
    const q = slab(P, V, at, ring, inner, T);
    p.el.sil.setAttribute("d", q.sil);
    p.el.cr.setAttribute("d", q.crease);
    const on = (u, v) => P(...at(u, v, T));
    const lines = [-W / 4, 0, W / 4].map((u) => seg(on(u, -D / 2 + 1.6), on(u, D / 2 - 1.6))).join("") + seg(on(-W / 2 + 1.6, 0), on(W / 2 - 1.6, 0));
    p.cells.setAttribute("d", q.tn === T ? lines : "");
  }

  const B = register(stage, (dt) => {
    let m = false;
    for (const p of panels) { if (stepS(p.gx, dt)) m = true; if (stepS(p.gy, dt)) m = true; draw(p); }
    return m;
  });
  bag.add(B.unregister);

  /** Every panel's slope toward the sun, clamped to the slider's tilt; the bright one is the panel nearest under it. */
  function aim() {
    let best = null, bd = Infinity;
    for (const p of panels) {
      let gx = (sun[0] - p.cx) / HS, gy = (sun[1] - p.cy) / HS;
      const m = Math.hypot(gx, gy);
      if (m > maxG) { gx *= maxG / m; gy *= maxG / m; }
      p.gx.t = gx; p.gy.t = gy;
      const d = Math.hypot(sun[0] - p.cx, sun[1] - p.cy);
      if (d < bd) { bd = d; best = p; }
    }
    const k = panels.indexOf(best);
    if (k !== pick) { pick = k; panels.forEach((p) => p.el.sil.classList.toggle("hi", p === best)); }
    B.wake();
    return best;
  }

  aim();
  bag.add(pointer(stage, {
    move: ([sx, sy]) => {
      const [x, y] = unproj(C, sx, sy, HP);
      sun = [clamp(x, -PX, X1 + PX), clamp(y, -PY, Y1 + PY)];
      const p = aim();
      read.textContent = `panel ${p.i + 1}·${p.j + 1}`;
    },
    leave: () => { sun = SUN0; aim(); read.textContent = "rest"; },
  }));
  bag.add(() => svg.replaceChildren());

  return {
    set: (v) => { maxG = Math.tan((v * Math.PI) / 180); aim(); },
    destroy: bag.dispose,
  };
}

hairline({
  name: "solar-panels",
  means: "Solar panels on posts: wherever the pointer is, the sun is, and every panel tilts to face it.",
  rules: [1, 3, 5, 9],
  range: [25, 45, 65],
  mount,
});
})();
</script>
<script>
(() => {
/**
 * bookshelf: an open bookcase holding eleven books of mixed heights and
 * thicknesses, each spine banded or labelled, the last one leaning on its
 * neighbour. The pointer picks the book whose resting spine is nearest it on
 * screen; it tips forward and slides out toward the reader, and its neighbours
 * come a little way with it, staggered outwards on the 700ms curve. At rest one book stands
 * half out, bright. The slider is how far a book comes out.
 */
const {
  Cam, fit, hull, open, poly, proj, rings, rrect, run, seg, prism, facing,
  tween, tset, tval, tdone, mk, pointer, put, register, disposer, solid,
} = HL;

const BOOKS = [[7, 38, 0], [9, 45, 1], [6, 34, 2], [8, 41, 0], [10, 47, 1], [6, 32, 2], [7, 43, 0], [9, 37, 1], [5, 30, 2], [8, 40, 0], [7, 46, 1]];
const DB = 22, DC = 27, HT = 54, SIDE = 4, LEAN = 0.36, REST = 4, STEP = 45, TIP = 0.24, NEAR = [1, 0.42, 0.15];

/** The direction toward the camera, from what P does to the three axes. */
function viewDir(P) {
  const o = P(0, 0, 0), e = [P(1, 0, 0), P(0, 1, 0), P(0, 0, 1)].map((p) => [p[0] - o[0], p[1] - o[1]]);
  const a = e.map((v) => v[0]), b = e.map((v) => v[1]);
  const v = [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]];
  return v[2] < 0 ? v.map((c) => -c) : v;
}

/** A rounded slab: ring and inner in its own (u, v), T thick; at(u, v, t) places it. The crease is the near face's inner run that borders a side. */
function slab(P, V, at, ring, inner, T) {
  const w = (q, t) => P(...at(q.u, q.v, t)), a = at(0, 0, 0), b = at(0, 0, T);
  const tn = (b[0] - a[0]) * V[0] + (b[1] - a[1]) * V[1] + (b[2] - a[2]) * V[2] > 0 ? T : 0, tf = T - tn;

  const r = Math.hypot(o[0], o[1]) > 0.2 ? run(inner, keep) : [];
  return { sil: poly(hull(ring.map((q) => w(q, tn)).concat(ring.map((q) => w(q, tf))))), crease: r.length > 1 ? open(r.map((q) => w(q, tn))) : "", tn };

/** The books along the shelf: where each foot stands, and the last one leaning left onto the top corner of the one before. */
function shelve() {

function mount({ stage, svg, read }, value) {

  const C = Cam(45, 0.5, 2.28);

  const g = mk("g", {}, svg);

  block(-SIDE, -3, 0, DC, 1.6, 0.8, -4, HT + 4);

    b.el.cr.setAttribute("d", q.crease);
    b.marks.setAttribute("d", spine(b.w, b.h, b.kind).map((m) => (m.length > 2 ? poly(m.map(([u, v]) => P(...at(u, v, DB)))) : seg(P(...at(...m[0], DB)), P(...at(...m[1], DB))))).join(""));

  function hit([sx]) {

    return best;
  }

  function apply(from) {
    const now = performance.now();
    books.forEach((b, i) => {
      const d = Math.abs(i - (act < 0 ? REST : act));
      const to = act < 0 ? (i === REST ? PULL * 0.45 : 0) : PULL * (NEAR[d] || 0);
      tset(b.p, to, now, Math.abs(i - from) * STEP);
      tset(b.f, act >= 0 && d === 0 ? TIP : 0, now, Math.abs(i - from) * STEP);

    B.wake();
  }
  function setActive(a) { if (a === act) return; const from = a >= 0 ? a : act; act = a; apply(from); }

  apply(REST);
  bag.add(pointer(stage, { move: (p) => setActive(hit(p)), leave: () => setActive(-1) }));
  bag.add(() => svg.replaceChildren());

  return {
    set: (v) => { PULL = v; apply(act < 0 ? REST : act); },
    destroy: bag.dispose,
  };
}

hairline({
  name: "bookshelf",
  means: "A bookcase of mixed books: the one under the pointer slides out toward you, and its neighbours follow a little.",
  rules: [1, 2, 5, 9],
  range: [7, 12, 17],
  mount,

})();

<script>
(() => {
/**
 * baggage-carousel: an oval belt of slats running round a raised island, six
 * suitcases riding it, each with its handle and its lid seam. The belt never
 * stops. Over the carousel it slows, on a spring, so a bag can be followed,
 * and the bag nearest the pointer on the belt takes the bright edge. Bags
 * behind the island are painted before it and the rest after, nearest last.
 * The slider is the belt's speed.
 */
const {
  Cam, facing, fit, open, prism, proj, rings, rrect, ringAt, run, seg, unproj, reducedMotion,
  spring, stepS, mk, pointer, put, register, disposer, solid,
} = HL;

const LH = 46, RC = 33, BW = 11, ZB = 7, ZI = 12, SLOW = 0.12, SLAT = 6.5;
const BAGS = [[24, 15, 8], [16, 9, 18], [26, 16, 7], [15, 11, 10], [21, 14, 9], [14, 8, 16]];
const LEN = 4 * LH + 2 * Math.PI * RC, GAPS = [0, 0.15, 0.31, 0.5, 0.64, 0.81];

/** The belt's centreline at arc length s: where, and its heading. Clockwise on screen: the far straight runs toward +x. */
function along(s, off = 0) {
  s = ((s % LEN) + LEN) % LEN;
  const r = RC + off, arc = Math.PI * RC;
  if (s < 2 * LH) return { x: -LH + s, y: -r, a: 0 };
  s -= 2 * LH;
  if (s < arc) { const t = s / RC - Math.PI / 2; return { x: LH + r * Math.cos(t), y: r * Math.sin(t), a: t + Math.PI / 2 }; }
  s -= arc;
  if (s < 2 * LH) return { x: LH - s, y: r, a: Math.PI };
  s -= 2 * LH;
  const t = s / RC + Math.PI / 2;
  return { x: -LH + r * Math.cos(t), y: r * Math.sin(t), a: t + Math.PI / 2 };

/** A ring turned by a about the origin and moved to (x, y), its normals turned with it. */
const turn = (ring, x, y, a) => {
  const c = Math.cos(a), s = Math.sin(a);
  return ring.map((q) => ({ u: x + q.u * c - q.v * s, v: y + q.u * s + q.v * c, nu: q.nu * c - q.nv * s, nv: q.nu * s + q.nv * c }));

function mount({ stage, svg, read }, value) {
  const bag = disposer();
  let rate = value, phase = 0, over = null, lit = -1;
  const sp = spring(rate);

  const C = Cam(45, 0.5, 1.66);
  const RO = RC + BW + 4;
  fit(C, [[-LH - RO, -RO, 0], [LH + RO, RO, 0], [LH + RO, -RO, 0], [-LH - RO, RO, 0], [-LH, -RC, ZB + 21], [LH, -RC, ZB + 21]], 200, 166);
  const P = proj(C), front = facing(C);
  const stad = (r, b) => [rrect(-LH - r, -r, LH + r, r, r, 14), rrect(-LH - r + b, -r + b, LH + r - b, r - b, r - b, 14)];

  const g = mk("g", {}, svg);
  const [or, oi] = stad(RO, 2);

  const slats = mk("path", { class: "nf lo" }, g);
  const gFar = mk("g", {}, g);
  const [ir, ii] = stad(RC - BW - 1, 2.2);
  put(solid(g), prism(P, front, ir, ii, 0, ZI));
  const gNear = mk("g", {}, g);

  const bags = BAGS.map(([l, w, h], k) => {
    const [ring, inner] = rings(-l / 2, -w / 2, l / 2, w / 2, 2.8, 1.1), [hr, hi] = rings(-4, -0.8, 4, 0.8, 0.8, 0.3);

  let order = "";

    let d = "";
    const o0 = ((phase % SLAT) + SLAT) % SLAT;

    slats.setAttribute("d", d);

      put(b.handle, prism(P, front, turn(b.hr, c.x, c.y, c.a), turn(b.hi, c.x, c.y, c.a), z1, z1 + 2.6));

    const sorted = bags.slice().sort((a, b) => a.at.x + a.at.y - (b.at.x + b.at.y));
    const key = sorted.map((b) => b.k + (b.front ? "n" : "f")).join();
    if (key !== order) { order = key; sorted.forEach((b) => (b.front ? gNear : gFar).appendChild(b.el.g)); }
  }

  /** The bag nearest the pointer on the belt, or the first at rest. */
  function light() {
    let best = 0;
    if (over) { let bd = Infinity; bags.forEach((b) => { const dd = Math.hypot(b.at.x - over[0], b.at.y - over[1]); if (dd < bd) { bd = dd; best = b.k; } }); }
    if (best !== lit) { lit = best; bags.forEach((b) => b.el.sil.classList.toggle("hi", b.k === best)); }
    read.textContent = over ? `bag ${best + 1}` : "rest";
  }

  const B = register(stage, (dt) => {
    sp.t = over ? rate * SLOW : rate;
    stepS(sp, dt);

    draw(); light();
    return !reducedMotion();
  });
  bag.add(B.unregister);

  const onCarousel = ([x, y]) => Math.hypot(x - Math.max(-LH, Math.min(LH, x)), y) < RO + 6;
  bag.add(pointer(stage, {
    move: ([sx, sy]) => { const w = unproj(C, sx, sy, ZB); over = onCarousel(w) ? w : null; B.wake(); },
    leave: () => { over = null; B.wake(); },
  }));
  bag.add(() => svg.replaceChildren());

  return {
    set: (v) => { rate = v; B.wake(); },
    destroy: bag.dispose,
  };
}

hairline({
  name: "baggage-carousel",
  means: "Suitcases riding a carousel that never stops: over it the belt slows, so you can follow the bag that is yours.",
  rules: [4, 6, 7, 8],
  range: [10, 18, 30],
  mount,

})();

<script>
(() => {
/**
 * mailboxes: a bank of twelve mailboxes on a plinth, four across and three
 * high, each door with its name slot and keyhole, hinged along its foot. The
 * pointer picks the door under it, tested on the closed doors' plane; it drops
 * open like a flap on what was delivered, and the doors beside it rattle ajar,
 * staggered outwards. At rest one door stands ajar on a letter, bright. The slider is
 * how far the picked door opens, in degrees.
 */
const {
  Cam, clamp, fit, hull, open, poly, prism, proj, rings, rrect, run, seg, facing, rad,
  tween, tset, tval, tdone, mk, pointer, put, register, disposer, solid,
} = HL;

const NC = 4, NR = 3, CWD = 24, RHT = 25, M = 4, FOOT = 8, T = 1.4, STEP = 50, REST = 5, AJAR = [1, 0.05];
const W = M * 2 + NC * CWD - 3, H = FOOT + NR * RHT + M, DEP = 26;
const MAIL = new Set([1, 5, 6, 7, 10]);

/** The direction toward the camera, from what P does to the three axes. */
function viewDir(P) {
  const o = P(0, 0, 0), e = [P(1, 0, 0), P(0, 1, 0), P(0, 0, 1)].map((p) => [p[0] - o[0], p[1] - o[1]]);
  const a = e.map((v) => v[0]), b = e.map((v) => v[1]);
  const v = [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]];
  return v[2] < 0 ? v.map((c) => -c) : v;
}

/** A rounded slab: ring and inner in its own (u, v), T thick; at(u, v, t) places it. The crease is the near face's inner run that borders a side. */
function slab(P, V, at, ring, inner, T) {
  const w = (q, t) => P(...at(q.u, q.v, t)), a = at(0, 0, 0), b = at(0, 0, T);
  const tn = (b[0] - a[0]) * V[0] + (b[1] - a[1]) * V[1] + (b[2] - a[2]) * V[2] > 0 ? T : 0, tf = T - tn;
  const n0 = P(...at(0, 0, tn)), f0 = P(...at(0, 0, tf)), o = [f0[0] - n0[0], f0[1] - n0[1]];
  const keep = (q) => { const p = w(q, tn), s = P(...at(q.u + q.nu, q.v + q.nv, tn)); return (s[0] - p[0]) * o[0] + (s[1] - p[1]) * o[1] > 0.01; };
  const r = Math.hypot(o[0], o[1]) > 0.2 ? run(inner, keep) : [];
  return { sil: poly(hull(ring.map((q) => w(q, tn)).concat(ring.map((q) => w(q, tf))))), crease: r.length > 1 ? open(r.map((q) => w(q, tn))) : "", tn };
}

/** The point (x, z) on the wall y = 0 under a screen point. */
function onWall(P, sx, sy) {
  const o = P(0, 0, 0), ex = P(1, 0, 0), ez = P(0, 0, 1);
  const a = ex[0] - o[0], b = ez[0] - o[0], c = ex[1] - o[1], d = ez[1] - o[1], det = a * d - b * c, rx = sx - o[0], ry = sy - o[1];
  return [(rx * d - b * ry) / det, (a * ry - c * rx) / det];
}

function mount({ stage, svg, read }, value) {
  const bag = disposer();
  let OPEN = value, act = -1;

  const C = Cam(45, 0.5, 2.2);
  fit(C, [[-5, -DEP - 4, -4], [W + 5, 4, -4], [W + 5, -DEP - 4, -4], [-5, 4, -4], [0, -DEP, H + 4], [W, -DEP, H + 4], [M, CWD, FOOT]], 200, 166);
  const P = proj(C), V = viewDir(P), front = facing(C);
  const block = (x0, y0, x1, y1, r, b, z0, z1) => { const [ring, inner] = rings(x0, y0, x1, y1, r, b); put(solid(g), prism(P, front, ring, inner, z0, z1)); };
  const wall = (pts) => poly(pts.map(([x, z]) => P(x, 0.05, z)));

  const g = mk("g", {}, svg);
  block(-5, -DEP - 4, W + 5, 4, 3, 1.4, -4, 0);
  block(0, -DEP, W, 0, 2, 1.2, 0, H);
  block(-2, -DEP - 2, W + 2, 2, 2, 1, H, H + 4);
  mk("path", { d: wall([[M, 3], [W - M, 3], [W - M, 4.4], [M, 4.4]]), class: "nf lo" }, g);

  // each opening, and what was delivered behind it, drawn before any door
  const doors = [];
  for (let c = 0; c < NC; c++) for (let r = 0; r < NR; r++) {
    const x0 = M + c * CWD, z0 = FOOT + r * RHT, w = CWD - 3, h = RHT - 3, n = c * NR + (NR - 1 - r);
    mk("path", { d: wall(rrect(x0 + 1, z0 + 1, x0 + w - 1, z0 + h - 1, 1.5, 3).map((q) => [q.u, q.v])), class: "nf lo" }, g);
    if (MAIL.has(n)) {
      const ex = (u, v) => P(x0 + u, -4, z0 + v);
      mk("path", { d: poly([ex(3, 2), ex(w - 4, 2), ex(w - 4, 13), ex(3, 13)]) + open([ex(3, 13), ex(w / 2 - 0.5, 7), ex(w - 4, 13)]), class: "nf" }, g);
    }
    doors.push({ n, c, r, x0, z0, w, h });
  }
  doors.forEach((d) => {
    d.el = solid(g); d.marks = mk("path", { class: "nf lo" }, d.el.g); d.a = tween(0); d.drawn = NaN;
    d.ring = rrect(0, d.z0, d.w, d.z0 + d.h, 2, 4); d.inner = rrect(0.9, d.z0 + 0.9, d.w - 0.9, d.z0 + d.h - 0.9, 1.2, 4);
  });

  function draw(d, deg) {
    if (deg === d.drawn) return;
    d.drawn = deg;
    const s = Math.sin(rad(deg)), c = Math.cos(rad(deg));
    const at = (u, v, t) => [d.x0 + u, (v - d.z0) * s + t * c, d.z0 + (v - d.z0) * c - t * s];
    const q = slab(P, V, at, d.ring, d.inner, T);
    d.el.sil.setAttribute("d", q.sil);
    d.el.cr.setAttribute("d", q.crease);
    const on = (u, v) => P(...at(u, v, T));
    const slot = poly(rrect(4, d.z0 + d.h - 7, d.w - 4, d.z0 + d.h - 3.5, 1.2, 3).map((p) => on(p.u, p.v)));
    const key = poly(rrect(d.w - 4.6, d.z0 + d.h / 2 - 2.6, d.w - 2.6, d.z0 + d.h / 2 - 0.6, 1, 3).map((p) => on(p.u, p.v)));
    d.marks.setAttribute("d", q.tn === T ? slot + key : "");
  }

  const B = register(stage, (_dt, now) => {
    let moving = false;
    for (const d of doors) { draw(d, tval(d.a, now)); if (!tdone(d.a, now)) moving = true; }
    return moving;
  });
  bag.add(B.unregister);

  /** The door whose closed face holds the point, on the wall's plane; -1 off the bank. */
  function hit([sx, sy]) {
    const [x, z] = onWall(P, sx, sy);
    const d = doors.find((d) => x >= d.x0 - 1.5 && x <= d.x0 + d.w + 1.5 && z >= d.z0 - 1.5 && z <= d.z0 + d.h + 1.5);
    return d ? d.n : -1;
  }

  function apply(from) {
    const now = performance.now(), a = doors.find((d) => d.n === (act < 0 ? REST : act)), f = doors.find((d) => d.n === from) || a;
    for (const d of doors) {
      const k = Math.abs(d.c - a.c) + Math.abs(d.r - a.r);
      const to = act < 0 ? (d === a ? 30 : 0) : OPEN * (AJAR[k] || 0);
      tset(d.a, to, now, Math.hypot(d.c - f.c, d.r - f.r) * STEP);
      d.el.sil.classList.toggle("hi", d === a);
    }
    read.textContent = act < 0 ? "rest" : `box ${String(act + 1).padStart(2, "0")}`;
    B.wake();
  }
  function setActive(n) { if (n === act) return; const from = n >= 0 ? n : act; act = n; apply(from); }

  apply(REST);
  bag.add(pointer(stage, { move: (p) => setActive(hit(p)), leave: () => setActive(-1) }));
  bag.add(() => svg.replaceChildren());

  return {
    set: (v) => { OPEN = clamp(v, 0, 92); apply(act < 0 ? REST : act); },
    destroy: bag.dispose,
  };
}

hairline({
  name: "mailboxes",
  means: "A bank of mailboxes: the door under the pointer drops open on what was delivered, and its neighbours rattle ajar.",
  rules: [1, 2, 5, 6],
  range: [55, 75, 92],
  mount,
});
})();

<script>
(() => {
/**
 * blinds: a venetian blind in a window frame, sixteen slats on two ladder
 * cords between a headrail and a bottom rail, a tilt wand hanging at one end.
 * The pointer's height, read on the window's plane, opens the slats near it on
 * their own springs, the nearest flat open and the far ones shut, as far as
 * the slider's radius reaches. At rest a band near the top stands open. The
 * nearest slat takes the bright edge.
 */
const {
  Cam, clamp, fit, hull, lerp, open, poly, prism, proj, rings, rrect, run, seg, facing, rad,
  spring, stepS, mk, pointer, put, register, disposer, solid,
} = HL;

const N = 16, L = 116, GAP = 6.4, DW = 5.2, T = 0.7, Z1 = 8 + N * GAP, SHUT = -74, OPEN = -4;
const REST = (k) => 0.1 + 0.8 * Math.exp(-(((k - 4) / 2.4) ** 2));

/** The share of open at u radii from the pointer: 1 → .3 at 45% → .05 at the edge and beyond. */

  function retarget() {
    for (const s of slats) s.sp.t = over === null ? REST(s.k) : falloff(Math.abs(s.k - over) / R);

  bag.add(pointer(stage, { move: (p) => { over = slatAt(p); retarget(); }, leave: () => { over = null; retarget(); } }));
  bag.add(() => svg.replaceChildren());

  return {
    set: (v) => { R = v; retarget(); },
    destroy: bag.dispose,
  };

hairline({
  name: "blinds",
  means: "A venetian blind: the slats open where the pointer is and stay shut further away.",
  rules: [1, 3, 5, 9],
  range: [2, 4, 7],
  mount,

<script>
(() => {
/**
 * swatch-fan: a fan deck of twelve colour strips standing on one rivet, spread
 * over a half turn and stacked, each strip ruled into five chips. The pointer
 * picks the strip whose resting angle is nearest its own about the rivet; it
 * keeps its place in the stack, slides a little out along itself and takes the
 * bright edge, and the strips either side
 * part from it by the slider's angle, staggered outwards on the 700ms curve.
 * At rest one strip stands a little out of the deck, bright.
 */
const {
  Cam, fit, proj, rad, rrect, seg, hull, poly, open, run, circ, tween, tset, tval, tdone, mk, pointer, put, register, disposer, solid,

const N = 12, U0 = -7, U1 = 72, HW = 6.5, T = 1, DZ = 1.25, A0 = 14, A1 = 166, REST = 7, OUT = 6, STEP = 40;

/** The direction toward the camera, from what P does to the three axes. */

  const o = P(0, 0, 0), e = [P(1, 0, 0), P(0, 1, 0), P(0, 0, 1)].map((p) => [p[0] - o[0], p[1] - o[1]]);

/** A rounded slab: ring and inner in its own (u, v), T thick; at(u, v, t) places it. The crease is the near face's inner run that borders a side. */

  const tn = (b[0] - a[0]) * V[0] + (b[1] - a[1]) * V[1] + (b[2] - a[2]) * V[2] > 0 ? T : 0, tf = T - tn;
  const n0 = P(...at(0, 0, tn)), f0 = P(...at(0, 0, tf)), o = [f0[0] - n0[0], f0[1] - n0[1]];
  const keep = (q) => { const p = w(q, tn), s = P(...at(q.u + q.nu, q.v + q.nv, tn)); return (s[0] - p[0]) * o[0] + (s[1] - p[1]) * o[1] > 0.01; };
  const r = Math.hypot(o[0], o[1]) > 0.2 ? run(inner, keep) : [];

  const bag = disposer();
  let PART = value, act = -1;

  const C = Cam(45, 0.5, 2.1);

  bag.add(() => svg.replaceChildren());

  return {
    set: (v) => { PART = v; apply(act < 0 ? REST : act); },
    destroy: bag.dispose,
  };
}

hairline({
  name: "swatch-fan",
  means: "A fan deck of colour strips: the one under the pointer slides out of the deck, and the rest part around it.",
  rules: [1, 2, 5, 9],

  mount,
});

<script>
(() => {

 * on a plate, each as tall as its probability, and a temperature track along
 * the plate's front. The pointer's place along the track sets the
 * temperature: cold and the likeliest bar towers over the rest, hot and they
 * level out, each bar on its own spring. Only the top k, the slider, keep a
 * share; the rest sink to stubs. At rest the temperature is 1, the likeliest bar bright.

  Cam, clamp, fit, lerp, proj, prism, rings, seg, facing, unproj,
  spring, stepS, mk, pointer, put, register, disposer, solid, flatDot, place,

<script>
(() => {

 * agent-tools: an agent at the centre of a ring of six tools, each a block

 * terminal. A dashed cable arcs from the agent to every tool. The pointer
 * picks the tool whose angle about the agent is nearest its own; that tool
 * lifts by the slider's height, its cable goes solid and a call runs out along
 * it, while the last one settles. At rest the agent is wired to search.

const {

  tween, tset, tval, tdone, mk, pointer, put, register, disposer, solid,
} = HL;

const RR = 50, HB = 10, HH = 9, TB = 9, TH = 7, REST = 0;
const NAMES = ["search", "code", "files", "browser", "database", "terminal"];
const ANG = NAMES.map((_, i) => rad(-60 + i * 60));

/** Each tool's lid glyph, strokes in its own (u, v) across a lid of half-width TB. */

  [arc(-1, 1, 3.4, 0, Math.PI * 2, 20), [[1.5, -1.5], [5, -5]]],
  [[[-2.5, 3.5], [-5.5, 0], [-2.5, -3.5]], [[2.5, 3.5], [5.5, 0], [2.5, -3.5]], [[1, 4], [-1, -4]]],
  [[[-4, 5], [2, 5], [4.5, 2.5], [4.5, -5], [-4, -5], [-4, 5]], [[2, 5], [2, 2.5], [4.5, 2.5]], [[-2, 0], [2.5, 0]], [[-2, -2.5], [2.5, -2.5]]],
  [[[-5.5, 4.5], [5.5, 4.5], [5.5, -4.5], [-5.5, -4.5], [-5.5, 4.5]], [[-5.5, 2], [5.5, 2]], [[-4, 3.2], [-3.4, 3.2]], [[-2.4, 3.2], [-1.8, 3.2]]],

    set: (v) => { LIFT = v; apply(); },
    destroy: bag.dispose,

<script>
(() => {
/**
 * layer-stack: a screen design exploded into its layers, floating one over the
 * next: the background on its dot grid, the card, the image with its hills and sun, the text lines and the
 * button. The pointer picks the layer under it, the top one first; it slides
 * back out of the stack on its own level and takes the bright edge, the last one sliding
 * back. The slider is the gap between layers. At rest the image is half out.
 */
const {
  Cam, fit, open, proj, prism, rings, facing, unproj, circ,
  tween, tset, tval, tdone, mk, pointer, put, register, disposer, solid,
} = HL;

const H = 64, T = 1.4, OUT = 30, REST = 2;

  { box: [0, 0, 86, H], r: 4, marks: () => { const m = []; for (let u = 8; u < 86; u += 10) for (let v = 8; v < H; v += 10) m.push([[u - 0.6, v], [u + 0.6, v]]); return m; } },
  { box: [10, 7, 76, 57], r: 4, marks: () => [] },
  { box: [15, 27, 71, 52], r: 2.5, marks: () => [[[17, 30], [30, 43], [39, 35], [47, 42], [69, 30]], circ(3.2, 16).map((q) => [58 + q.u, 45 + q.v]).concat([[61.2, 45]])] },

  const bag = disposer();
  let GAP = value, act = -1;

  const C = Cam(45, 0.5, 2.1);
  fit(C, [[0, 0, 0], [86, 0, 0], [86, H, 0], [0, H, 0], [10, -OUT, 4 * 18 + OUT * 0.6], [76, -OUT, 4 * 18 + OUT * 0.6], [0, H, 4 * 13]], 200, 164);

<script>
(() => {
/**
 * responsive-grid: a browser page, its address bar and three dots along the
 * top, holding eight cards in a fluid grid, each card an image block over two
 * lines, and a handle on the page's right edge. The pointer drags the edge: the container widens and narrows on a
 * spring, the cards stretch with it, and when a column no longer fits (the
 * slider is the narrowest a card may be) the grid reflows, every card gliding
 * to its new cell, lifted clear of the others, and the container growing deeper. The handle is bright.
 */
const {
  Cam, clamp, fit, poly, proj, prism, rings, rrect, seg, facing, unproj,
  spring, stepS, mk, pointer, put, register, disposer, solid, flatDot, place,
} = HL;

/** Columns that fit in width w with cards at least m wide, two to four. */

const depthFor = (cols) => { const rows = Math.ceil(N / cols); return TOP + PAD + rows * CH + (rows - 1) * G; };

function mount({ stage, svg, read }, value) {
  const bag = disposer();
  let MIN = value, over = null, cols = colsFor(REST, MIN);

  const C = Cam(45, 0.5, 1.9);
  fit(C, [[0, 0, 0], [WR[1] + 4, 0, 0], [WR[1] + 4, depthFor(4), 0], [0, depthFor(2), 0], [WR[0], depthFor(2), 0], [0, 0, 8 + HOP]], 200, 160);
  const P = proj(C), front = facing(C);

  const g = mk("g", {}, svg);
  const page = solid(g), bar = mk("path", { class: "nf lo" }, g);
  [6, 10.5, 15].forEach((x) => place(flatDot(g, C, 1.3, "dot off"), P(x, 4.5, ZP)));
  const cardsG = mk("g", {}, g), handle = solid(g);
  handle.sil.classList.add("hi");
  const W = spring(REST, { eps: 0.05 }), D = spring(depthFor(cols), { eps: 0.05 });
  const cards = Array.from({ length: N }, (_, i) => ({ i, el: solid(cardsG), marks: null, x: spring(0, { eps: 0.03 }), y: spring(0, { eps: 0.03 }), w: spring(10, { eps: 0.03 }), lift: 0, drawn: "" }));

    cards.forEach((c) => { c.x.t = PAD + (c.i % cols) * (cw + G); c.y.t = TOP + Math.floor(c.i / cols) * (CH + G); c.w.t = cw; });
  }

  let drawnPage = "";
  function draw() {
    const w = W.x, d = D.x, key = w.toFixed(2) + "," + d.toFixed(2);
    if (key !== drawnPage) {
      drawnPage = key;
      const [ring, inner] = rings(0, 0, w, d, 4, 1.2);
      put(page, prism(P, front, ring, inner, 0, ZP));
      bar.setAttribute("d", seg(P(0.6, 9, ZP), P(w - 0.6, 9, ZP)) + poly(rrect(22, 2.5, Math.max(30, w * 0.55), 6.5, 2, 3).map((q) => P(q.u, q.v, ZP))));
      const [hr, hi] = rings(w - 1.6, d / 2 - 7, w + 1.6, d / 2 + 7, 1.6, 0.6);
      put(handle, prism(P, front, hr, hi, ZP, ZP + 4));
    }
    for (const c of cards) {
      const x = c.x.x, y = c.y.x, cw = Math.max(4, c.w.x), k = [x, y, cw, c.lift].map((v) => v.toFixed(2)).join();

  const B = register(stage, (dt) => {
    let m = stepS(W, dt) | stepS(D, dt);
    const nc = colsFor(W.x, MIN);
    if (nc !== cols && colsFor(W.x + (nc > cols ? -HYS : HYS), MIN) === nc) { cols = nc; D.t = depthFor(cols); }

  aim();
  bag.add(pointer(stage, {
    move: ([sx, sy]) => { const [x, y] = unproj(C, sx, sy, ZP); over = x > -30 && x < WR[1] + 30 && y > -30 && y < depthFor(2) + 30 ? x : null; aim(); },
    leave: () => { over = null; aim(); },
  }));
  bag.add(() => svg.replaceChildren());

    set: (v) => { MIN = v; B.wake(); },
    destroy: bag.dispose,

hairline({
  name: "responsive-grid",
  means: "A responsive grid of cards: drag the container's edge and the cards stretch, then reflow into fewer or more columns.",
  rules: [3, 8],
  range: [28, 36, 46],
  mount,

})();

 * pulley-weights: a pulley wheel on a post and arm over a base, a cord over
 * it and a weight on each end, a tall block on the left and a stack of three

  for (const m of order) {
    m.el = solid(g);
    const ring = circ(RC, 40).map((q) => ({ ...q, u: q.u + m.x, v: q.v + m.y }));
    const inner = circ(RC - 1.2, 40).map((q) => ({ ...q, u: q.u + m.x, v: q.v + m.y }));
    put(m.el, prism(P, front, ring, inner, 0, ZT));
    mk("path", { class: "lo", d: seg(P(m.x, m.y - RC + 1.6, ZT), P(m.x, m.y - RC + 3, ZT)) }, m.el.g);
    m.south = mk("path", { class: "nf" }, m.el.g);
    m.north = mk("path", { class: "sil" }, m.el.g);
  }

  let drawn = "";
  function draw() {
    const key = all.map((m) => m.a.x.toFixed(3)).join() + (mag ? mag.map((v) => v.toFixed(1)).join() + REACH : "");
    if (key === drawn) return;
    drawn = key;
    halo.setAttribute("d", mag ? poly(circ(REACH, 64).map((q) => P(Math.max(-BX, Math.min(BX, mag[0] + q.u)), Math.max(-BY, Math.min(BY, mag[1] + q.v)), ZT))) : "");
    for (const m of all) {
      const t = m.a.x, ux = Math.cos(t), uy = Math.sin(t), z = ZT + 0.6;
      const at = (l, w) => P(m.x + ux * l - uy * w, m.y + uy * l + ux * w, z);
      m.north.setAttribute("d", poly([at(LN, 0), at(0, WN), at(0, -WN)]));
      m.south.setAttribute("d", poly([at(-LN, 0), at(0, WN), at(0, -WN)]));
    }
  }

  const B = register(stage, (dt) => {
    let moving = false;
    for (const m of all) moving = stepS(m.a, dt) || moving;
    draw();
    return moving;
  });
  bag.add(B.unregister);

  /** Aim every needle: toward the magnet by how near it is, by the short way round; the near ones on stiffer springs. */
  function aim() {
    let turned = 0, near = -1, nd = 1e9;
    for (const m of all) {
      let goal = m.rest, k = 60;
      if (mag) {
        const dx = mag[0] - m.x, dy = mag[1] - m.y, d = Math.hypot(dx, dy), w = smooth(1 - d / REACH);
        goal = m.rest + w * wrap(Math.atan2(dy, dx) - m.rest);
        k = 90 / (1 + d / 18);
        if (w > 0.25) turned++;
        if (d < nd) { nd = d; near = m.i; }
      }
      m.a.k = k; m.a.c = 1.5 * Math.sqrt(k);
      m.a.t = m.a.x + wrap(goal - m.a.x);
    }
    const hi = mag ? (nd < D ? near : -1) : REST_LIT;
    if (hi !== lit) { lit = hi; all.forEach((m) => m.north.classList.toggle("hi", m.i === hi)); }
    read.textContent = mag ? `${turned} turned` : "rest";
    B.wake();
  }

  /** The point under the pointer on the compass tops, if it is over the board. */
  function onBoard([sx, sy]) {
    const [x, y] = unproj(C, sx, sy, ZT);
    return Math.abs(x) < BX + 8 && Math.abs(y) < BY + 8 ? [x, y] : null;
  }

  aim();
  bag.add(pointer(stage, { move: (p) => { mag = onBoard(p); aim(); }, leave: () => { mag = null; aim(); } }));
  bag.add(() => svg.replaceChildren());

  return {
    set: (v) => { REACH = v; aim(); },
    destroy: bag.dispose,
  };
}

hairline({
  name: "compass-field",
  means: "A field of compasses: bring the magnet near and every needle within reach turns to point at it.",
  rules: [2, 3, 4],
  range: [34, 60, 100],
  mount,
});
})();
</script>
<script>
(() => {
/**
 * ripple-pond: a shallow square basin of still water with a grid of round
 * floats on it, each with a short marker stick. The pointer over the water
 * lets a drop fall where it is, again as it moves or every so often while it
 * stays: a ring spreads from each drop, and a float rises and falls as a ring
 * passes under it, less the further it has travelled. The slider is how long a
 * ring carries. The read-out is how many floats are moving. The float nearest
 * the last drop is bright; at rest, the one in the middle. Still water sleeps.
 */
const {
  Cam, fit, proj, prism, rings, circ, seg, poly, facing, unproj, mk, pointer, put, register, disposer, solid,
} = HL;

const COLS = 7, ROWS = 5, D = 14, RF = 3.7, BX = 50, BY = 37, SPEED = 34, WAVE = 13, AMP = 3.4, EVERY = 0.8;
const MID = Math.floor((ROWS * COLS) / 2);

function mount({ stage, svg, read }, value) {
  const bag = disposer();
  let TAU = value, now = 0, last = -9, at = null, from = null, lit = -2, drawn = "";
  const drops = [];

  const C = Cam(45, 0.5, 2.3);
  fit(C, [[-BX - 4, -BY - 4, -8], [BX + 4, BY + 4, -8], [-BX - 4, BY + 4, 2], [BX + 4, -BY - 4, 2], [0, 0, AMP + 8]], 200, 170);
  const P = proj(C), front = facing(C);

  const g = mk("g", {}, svg);
  { const [ring, inner] = rings(-BX - 4, -BY - 4, BX + 4, BY + 4, 6, 2); put(solid(g), prism(P, front, ring, inner, -8, 0)); }
  const crests = mk("path", { class: "nf lo" }, g);

  const floats = [];
  for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) floats.push({ i: r * COLS + c, x: (c - (COLS - 1) / 2) * D, y: (r - (ROWS - 1) / 2) * D, h: 0 });
  for (const f of floats.slice().sort((p, q) => p.x + p.y - (q.x + q.y))) { f.el = solid(g); f.stick = mk("path", { class: "lo" }, f.el.g); }
  const disc = (f) => circ(RF, 28).map((q) => ({ ...q, u: q.u + f.x, v: q.v + f.y })), lip = (f) => circ(RF - 0.9, 28).map((q) => ({ ...q, u: q.u + f.x, v: q.v + f.y }));

  /** The water's height at (x, y): a short wave train on each drop's ring, fading with the ring's age. */
  function height(x, y) {
    let h = 0;
    for (const d of drops) {
      const age = now - d.t, off = Math.hypot(x - d.x, y - d.y) - SPEED * age;
      if (off > WAVE) continue;
      h += AMP * Math.exp(-age / TAU) * Math.cos((2 * Math.PI * off) / WAVE) * Math.exp(-((off / WAVE) ** 2) * 1.6);
    }
    return h;
  }

  function draw() {
    let moving = 0, key = "";
    for (const f of floats) { f.h = height(f.x, f.y); if (Math.abs(f.h) > 0.4) moving++; key += f.h.toFixed(2); }
    if (key !== drawn) {
      drawn = key;
      for (const f of floats) {
        put(f.el, prism(P, front, disc(f), lip(f), f.h - 0.6, f.h + 1.2));
        f.stick.setAttribute("d", seg(P(f.x, f.y, f.h + 1.2), P(f.x, f.y, f.h + 6)));
      }
    }
    const clampXY = (x, y) => P(Math.max(-BX - 2, Math.min(BX + 2, x)), Math.max(-BY - 2, Math.min(BY + 2, y)), 0);
    crests.setAttribute("d", drops.filter((d) => Math.exp(-(now - d.t) / TAU) > 0.12).map((d) => poly(circ(SPEED * (now - d.t) + 0.5, 72).map((q) => clampXY(d.x + q.u, d.y + q.v)))).join(""));
    read.textContent = at || drops.length ? `${moving} moving` : "rest";
  }

  function drop(x, y) {
    drops.push({ x, y, t: now });
    if (drops.length > 6) drops.shift();
    last = now; from = [x, y];
    let best = MID, bd = 1e9;
    for (const f of floats) { const d = Math.hypot(f.x - x, f.y - y); if (d < bd) { bd = d; best = f.i; } }
    light(best);
  }
  function light(k) { if (k !== lit) { lit = k; floats.forEach((f) => f.el.sil.classList.toggle("hi", f.i === k)); } }

  const B = register(stage, (dt) => {
    now += dt;
    if (at && (now - last > EVERY || Math.hypot(at[0] - from[0], at[1] - from[1]) > 18)) drop(at[0], at[1]);
    while (drops.length && Math.exp(-(now - drops[0].t) / TAU) < 0.03) drops.shift();
    draw();
    if (!at && !drops.length) { light(MID); return false; }
    return true;
  });
  bag.add(B.unregister);

  /** The point on the water under the pointer, if it is over the basin. */
  function over([sx, sy]) {
    const [x, y] = unproj(C, sx, sy, 0);
    return Math.abs(x) < BX && Math.abs(y) < BY ? [x, y] : null;
  }

  light(MID);
  draw();
  bag.add(pointer(stage, { move: (p) => { at = over(p); B.wake(); }, leave: () => { at = null; B.wake(); } }));
  bag.add(() => svg.replaceChildren());

  return {
    set: (v) => { TAU = v; B.wake(); },
    destroy: bag.dispose,
  };
}

hairline({
  name: "ripple-pond",
  means: "Floats on a pond: drop something in and the ripple lifts each float in turn, less the further it travels.",
  rules: [2, 3, 7],
  range: [0.5, 1, 2],
  mount,
});
})();
</script>
<script>
(() => {
  const ICONS = {"play":"<svg viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M8 5.5v13l10.5-6.5z\"/></svg>","pause":"<svg viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M7.5 5.5h3v13h-3zM13.5 5.5h3v13h-3z\"/></svg>","sun":"<svg viewBox=\"0 0 24 24\" aria-hidden=\"true\" class=\"line\"><circle cx=\"12\" cy=\"12\" r=\"4\"/><path d=\"M12 2.5v2.5M12 19v2.5M2.5 12H5M19 12h2.5M5.3 5.3l1.8 1.8M16.9 16.9l1.8 1.8M5.3 18.7l1.8-1.8M16.9 7.1l1.8-1.8\"/></svg>","moon":"<svg viewBox=\"0 0 24 24\" aria-hidden=\"true\" class=\"line\"><path d=\"M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z\"/></svg>"};
  HL.inject(document);

  const cards = [...document.querySelectorAll("[data-figure]")].map((stage, k) => {
    const figure = window.__figures.get(stage.dataset.figure);
    stage.setAttribute("data-hairline", figure.name);
    stage.setAttribute("role", "img");
    stage.setAttribute("aria-label", figure.means);
    const svg = HL.mk("svg", { viewBox: "0 0 400 320", "aria-hidden": "true" }, stage);
    const read = { textContent: "" };
    const card = { figure, stage, phase: k * 0.37, hovered: false, handle: figure.mount({ stage, svg, read }, figure.range[1]) };
    stage.addEventListener("pointerenter", (e) => { if (e.isTrusted) card.hovered = true; });
    stage.addEventListener("pointerleave", (e) => { if (e.isTrusted) card.hovered = false; });
    return card;
  });

  /* play: a pointer of our own traces a figure-eight over each drawing, each a little out of step */
  const send = (c, type, x, y) => {
    const r = c.stage.getBoundingClientRect();
    c.stage.dispatchEvent(new PointerEvent(type, { clientX: r.left + (x / 400) * r.width, clientY: r.top + (y / 320) * r.height, pointerType: "mouse", bubbles: false }));
  };
  const PERIOD = 7000;
  let frame = 0;
  function tick(now) {
    let any = false;
    for (const c of cards) {
      if (!c.playing) continue;
      any = true;
      if (c.hovered) continue;
      const t = (now / PERIOD + c.phase) * Math.PI * 2;
      send(c, "pointermove", 200 + 105 * Math.sin(t), 165 + 70 * Math.sin(2 * t));
    }
    frame = any ? requestAnimationFrame(tick) : 0;
  }
  for (const btn of document.querySelectorAll("[data-play]")) {
    const c = cards.find((c) => c.figure.name === btn.dataset.play);
    btn.addEventListener("click", () => {
      c.playing = !c.playing;
      btn.innerHTML = c.playing ? ICONS.pause : ICONS.play;
      btn.setAttribute("aria-label", (c.playing ? "Pause " : "Play ") + c.figure.name);
      btn.setAttribute("aria-pressed", String(c.playing));
      if (c.playing && !frame) frame = requestAnimationFrame(tick);
      if (!c.playing && !c.hovered) send(c, "pointerleave", 0, 0);
    });
  }

  const search = document.getElementById("search"), empty = document.getElementById("empty");
  search.addEventListener("input", () => {
    const words = search.value.toLowerCase().split(" ").filter(Boolean);
    let shown = 0;
    for (const f of document.querySelectorAll("figure[data-search]")) {
      f.hidden = !words.every((w) => f.dataset.search.includes(w));
      if (!f.hidden) shown++;
    }
    empty.hidden = shown > 0;
  });
  addEventListener("keydown", (e) => {
    if (e.key === "/" && document.activeElement !== search) { e.preventDefault(); search.focus(); }
    else if (e.key === "Escape" && document.activeElement === search) { search.value = ""; search.dispatchEvent(new Event("input")); search.blur(); }
  });

  /* React: the figure's React copy in a modal, to copy or download */
  const highlight = function highlight(code) {
  const html = (t) => t.replace(/[&<>]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" })[c]);
  const re = /(\/\*[\s\S]*?\*\/|\/\/[^\n]*)|("(?:[^"\\\n]|\\.)*"|'(?:[^'\\\n]|\\.)*'|`(?:[^`\\]|\\.)*`)|\b(const|let|var|function|return|if|else|for|while|do|switch|case|break|continue|import|export|from|default|new|typeof|instanceof|of|in|type|interface|extends|class|null|undefined|true|false|this|async|await|try|catch|throw)\b|(\b\d+(?:\.\d+)?\b)/g;
  let out = "", last = 0;
  for (const m of code.matchAll(re)) {
    out += html(code.slice(last, m.index)) + `<span class="${m[1] ? "c" : m[2] ? "s" : m[3] ? "k" : "n"}">${html(m[0])}</span>`;
    last = m.index + m[0].length;
  }
  return out + html(code.slice(last));
};
  const engine = document.getElementById("hl-kernel").textContent.slice(1, -1);
  const sources = JSON.parse(document.getElementById("react-src").textContent);
  const modal = document.getElementById("code"), copy = document.getElementById("code-copy");
  let open = null;
  for (const btn of document.querySelectorAll("[data-react]")) btn.addEventListener("click", () => {
    const src = sources[btn.dataset.react], code = src.parts.join(engine);
    open = { file: src.file, code };
    document.getElementById("code-file").textContent = src.file;
    modal.querySelector(".src code").innerHTML = highlight(code);
    modal.querySelector(".gutter").textContent = code.split("\n").map((_, i) => i + 1).join("\n");
    modal.querySelector(".scroll").scrollTo(0, 0);
    copy.textContent = "Copy";
    modal.showModal();
  });
  document.getElementById("code-close").addEventListener("click", () => modal.close());
  modal.addEventListener("click", (e) => { if (e.target === modal) modal.close(); });

  /* on a phone the modal is a sheet: drag its handle or header down to put it away */
  const sheet = matchMedia("(max-width: 640px)");
  let drag = null;
  for (const el of [modal.querySelector(".grip"), modal.querySelector(".tools")]) {
    el.addEventListener("pointerdown", (e) => {
      if (!sheet.matches || e.target.closest("button")) return;
      drag = { y: e.clientY, t: e.timeStamp, dy: 0, v: 0 };
      el.setPointerCapture(e.pointerId);
      modal.classList.add("dragging");
    });
    el.addEventListener("pointermove", (e) => {
      if (!drag) return;
      const dy = Math.max(0, e.clientY - drag.y), dt = e.timeStamp - drag.t;
      if (dt > 0) drag.v = (dy - drag.dy) / dt;
      drag.dy = dy; drag.t = e.timeStamp;
      modal.style.transform = "translateY(" + dy + "px)";
    });
    const end = (e) => {
      if (!drag) return;
      const flick = e.timeStamp - drag.t < 100 && drag.v > 0.5;
      const away = drag.dy > modal.offsetHeight * 0.25 || flick;
      drag = null;
      modal.classList.remove("dragging");
      modal.style.transform = "";
      if (away) modal.close();
    };
    el.addEventListener("pointerup", end);
    el.addEventListener("pointercancel", end);
  }
  copy.addEventListener("click", async () => {
    try { await navigator.clipboard.writeText(open.code); } catch {
      const t = document.createElement("textarea");
      t.value = open.code; modal.append(t); t.select(); document.execCommand("copy"); t.remove();
    }
    copy.textContent = "Copied";
    setTimeout(() => (copy.textContent = "Copy"), 1200);
  });
  document.getElementById("code-download").addEventListener("click", () => {
    const link = document.createElement("a");
    link.href = URL.createObjectURL(new Blob([open.code], { type: "text/plain" }));
    link.download = open.file;
    link.click();
    setTimeout(() => URL.revokeObjectURL(link.href), 1000);
  });

  /* PNG: the drawing as it stands, with the computed paint written onto each shape */
  const PAINT = ["fill", "stroke", "stroke-dasharray", "stroke-linecap", "stroke-linejoin", "opacity", "visibility", "display"];
  function png(card) {
    const live = card.stage.querySelector("svg"), copy = live.cloneNode(true), W = 1600, H = 1280;
    const a = live.querySelectorAll("*"), b = copy.querySelectorAll("*");
    a.forEach((el, i) => {
      const cs = getComputedStyle(el);
      b[i].setAttribute("style", PAINT.map((k) => k + ":" + cs.getPropertyValue(k)).join(";") + ";stroke-width:" + (0.9 * 400) / 638);
    });
    copy.setAttribute("xmlns", "http://www.w3.org/2000/svg");
    copy.setAttribute("width", W);
    copy.setAttribute("height", H);
    const img = new Image();
    img.onload = () => {
      const c = document.createElement("canvas");
      c.width = W; c.height = H;
      const g = c.getContext("2d");
      g.fillStyle = getComputedStyle(document.body).backgroundColor;
      g.fillRect(0, 0, W, H);
      g.drawImage(img, 0, 0, W, H);
      c.toBlob((blob) => {
        const link = document.createElement("a");
        link.href = URL.createObjectURL(blob);
        link.download = card.figure.name + (root.dataset.theme === "dark" ? "-dark" : "") + ".png";
        link.click();
        setTimeout(() => URL.revokeObjectURL(link.href), 1000);
      }, "image/png");
    };
    img.src = "data:image/svg+xml;charset=utf-8," + encodeURIComponent(new XMLSerializer().serializeToString(copy));
  }
  for (const btn of document.querySelectorAll("[data-png]")) {
    const card = cards.find((c) => c.figure.name === btn.dataset.png);
    btn.addEventListener("click", () => png(card));
  }

  const theme = document.getElementById("theme"), root = document.documentElement;
  const paint = () => {
    const dark = root.dataset.theme === "dark";
    for (const a of document.querySelectorAll("[data-gif]")) a.href = "gif/" + a.dataset.gif + (dark ? "-dark" : "") + ".gif";
    theme.innerHTML = dark ? ICONS.sun : ICONS.moon;
    theme.setAttribute("aria-label", dark ? "Switch to light mode" : "Switch to dark mode");
  };
  theme.addEventListener("click", () => {
    root.classList.add("switching");
    root.dataset.theme = root.dataset.theme === "dark" ? "light" : "dark";
    localStorage.setItem("hl-theme", root.dataset.theme);
    paint();
    getComputedStyle(root).color;
    requestAnimationFrame(() => requestAnimationFrame(() => root.classList.remove("switching")));
  });
  paint();
})();
</script>
