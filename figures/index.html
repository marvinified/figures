<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Figures</title>
<script>
  /* the theme before first paint: the saved choice, else light */
  document.documentElement.dataset.theme = localStorage.getItem("hl-theme") || "light";
</script>
<style>
  :root { --bg: #fff; --ink: #1a1a1a; --dim: #9a9a9a; --track: #e6e6e6; --soft: #5c5c5c; --str: #4f7a57; --num: #8a6a2f; color-scheme: light; }
  [data-theme="dark"] { --bg: #0a0a0a; --ink: #ededed; --dim: #6f6f6f; --track: #2a2a2a; --soft: #b4b4b4; --str: #9cc3a3; --num: #d6b77a; color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--ink); }
  body { font: 12px/1.45 ui-sans-serif, system-ui, -apple-system, sans-serif; }
  .switching, .switching *, .switching *::before, .switching *::after { transition: none !important; }
  .bar { position: sticky; top: 0; z-index: 1; display: flex; align-items: center; gap: 18px; max-width: 1200px; margin: 0 auto; padding: 18px 24px; background: var(--bg); }
  .bar::after { content: ""; position: absolute; left: 0; right: 0; top: 100%; height: 32px; background: linear-gradient(var(--bg), transparent); pointer-events: none; }
  .bar h1 { flex: 1; margin: 0; font-size: 12px; font-weight: 500; }
  .icon { display: grid; place-items: center; width: 32px; height: 32px; padding: 0; border: 0; border-radius: 50%; background: none; color: var(--ink); cursor: pointer; }
  .icon:hover { background: var(--track); }
  .icon:focus-visible { outline: 1.5px solid var(--ink); outline-offset: 2px; }
  .icon svg { width: 18px; height: 18px; fill: currentColor; }
  .icon svg.line { fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
  main { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 28px 24px; max-width: 1200px; margin: 0 auto; padding: 8px 24px 64px; }
  figure { margin: 0; }
  .stage { --hairline-plate: var(--bg); }
  .view { position: relative; }
  .play { position: absolute; right: 4px; bottom: 4px; width: 28px; height: 28px; color: var(--dim); }
  .play svg { width: 14px; height: 14px; }
  .play:hover, .play[aria-pressed="true"] { color: var(--ink); }
  .no { margin-right: 7px; color: var(--dim); font: 400 10px/1 ui-monospace, Menlo, monospace; letter-spacing: 0.04em; }
  dialog.code { width: min(920px, calc(100vw - 48px)); height: min(720px, calc(100vh - 48px)); max-width: none; max-height: none; padding: 0; border: 1px solid var(--track); border-radius: 12px; background: var(--bg); color: var(--ink); overflow: hidden; }
  dialog.code { opacity: 0; transform: translateY(10px) scale(0.98); transition: opacity 220ms ease, transform 220ms ease, overlay 220ms allow-discrete, display 220ms allow-discrete; }
  dialog.code[open] { display: flex; flex-direction: column; opacity: 1; transform: none; }
  dialog.code::backdrop { background: rgba(255, 255, 255, 0); backdrop-filter: blur(0); -webkit-backdrop-filter: blur(0); transition: background 220ms ease, backdrop-filter 220ms ease, -webkit-backdrop-filter 220ms ease, overlay 220ms allow-discrete, display 220ms allow-discrete; }
  dialog.code[open]::backdrop { background: rgba(255, 255, 255, 0.45); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }
  [data-theme="dark"] dialog.code[open]::backdrop { background: rgba(0, 0, 0, 0.45); }
  @starting-style {
    dialog.code[open] { opacity: 0; transform: translateY(10px) scale(0.98); }
    dialog.code[open]::backdrop { background: rgba(255, 255, 255, 0); backdrop-filter: blur(0); -webkit-backdrop-filter: blur(0); }
  }
  dialog.code { box-shadow: 0 24px 64px rgba(0, 0, 0, 0.12); }
  html:has(dialog.code[open]) { overflow: hidden; }
  .grip { display: none; }
  @media (max-width: 640px) {
    dialog.code { width: 100%; height: 88dvh; margin: auto 0 0; border-width: 1px 0 0; border-radius: 16px 16px 0 0; opacity: 1; transform: translateY(100%); transition: transform 420ms cubic-bezier(0.32, 0.72, 0, 1), overlay 420ms allow-discrete, display 420ms allow-discrete; box-shadow: 0 -12px 40px rgba(0, 0, 0, 0.1); }
    dialog.code[open] { transform: none; }
    dialog.code.dragging { transition: none; }
    @starting-style { dialog.code[open] { opacity: 1; transform: translateY(100%); } }
    .grip { display: block; flex: none; padding: 8px 0 2px; touch-action: none; cursor: grab; }
    .grip::before { content: ""; display: block; width: 36px; height: 4px; margin: 0 auto; border-radius: 2px; background: var(--track); }
    .tools { padding: 6px 8px 10px 16px; touch-action: none; }
    .tools button { padding: 6px 12px; font-size: 12px; }
    .tools .close { width: 34px; height: 34px; font-size: 20px; }
    .scroll { padding-bottom: env(safe-area-inset-bottom); }
  }
  .tools { display: flex; align-items: center; gap: 6px; padding: 10px 10px 10px 16px; border-bottom: 1px solid var(--track); color: var(--dim); font: 12px/1.4 ui-monospace, Menlo, monospace; }
  .tools span { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tools button { padding: 3px 10px; border: 1px solid var(--track); border-radius: 999px; background: none; color: var(--dim); font: inherit; font-size: 11px; cursor: pointer; }
  .tools button:hover { color: var(--ink); border-color: var(--ink); }
  .tools button:focus-visible { outline: 1.5px solid var(--ink); outline-offset: 2px; }
  .tools .close { display: grid; place-items: center; width: 26px; height: 26px; padding: 0; border: 0; font-size: 16px; line-height: 1; }
  .scroll { flex: 1; display: flex; overflow: auto; font: 12px/1.6 ui-monospace, Menlo, monospace; }
  .scroll pre { margin: 0; padding: 12px 0; }
  .gutter { position: sticky; left: 0; padding: 12px 12px 12px 16px !important; min-width: 52px; text-align: right; color: var(--dim); background: var(--bg); user-select: none; opacity: 0.7; }
  .src { padding: 12px 16px 12px 4px !important; color: var(--ink); tab-size: 2; }
  .src .c { color: var(--dim); font-style: italic; }
  .src .s { color: var(--str); }
  .src .n { color: var(--num); }
  .src .k { font-weight: 600; }
  figcaption { padding: 4px 2px 0; color: var(--dim); font-size: 11.5px; }
  figcaption strong { display: block; margin-bottom: 1px; font-weight: 400; color: var(--soft); }
  figure[hidden] { display: none; }
  .exports { display: flex; gap: 6px; padding: 8px 2px 0; }
  .exports > * { padding: 3px 9px; border: 1px solid var(--track); border-radius: 999px; background: none; color: var(--dim); font: inherit; font-size: 10px; line-height: 1.4; text-decoration: none; cursor: pointer; transition: color 120ms, border-color 120ms; }
  .exports > *:hover { color: var(--ink); border-color: var(--ink); }
  .exports > *:focus-visible { outline: 1.5px solid var(--ink); outline-offset: 2px; }
  .search { width: 170px; height: 30px; padding: 0 12px; border: 0; border-radius: 15px; background: var(--track); color: var(--ink); font: inherit; font-size: 12px; outline: none; }
  .search::placeholder { color: var(--dim); }
  .search::-webkit-search-cancel-button { -webkit-appearance: none; }
  .search:focus-visible { outline: 1.5px solid var(--ink); outline-offset: 2px; }
  .empty { grid-column: 1 / -1; padding: 48px 0; text-align: center; color: var(--dim); }
  a.icon { text-decoration: none; }
  footer { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px 24px; max-width: 1200px; margin: 0 auto; padding: 20px 24px 32px; color: var(--dim); font-size: 11.5px; }
  footer a { color: var(--soft); text-decoration: none; }
  footer a:hover { color: var(--ink); text-decoration: underline; text-underline-offset: 2px; }
  footer a:focus-visible { outline: 1.5px solid var(--ink); outline-offset: 2px; border-radius: 2px; }
</style>
</head>

 unproj, clamp,\n  tween, tset, tval, tdone, flatDot, mk, place, pointer, put, register, disposer, solid,\n} = HL;\n\nconst R = 4.6, X0 = -8, X1 = 158, Y0 = -8, Y1 = 118, LIFT = 34, STEP = 40;\nconst CL = [[34, 32, 4, 7], [118, 30, 12, 6], [80, 88, 7, 7]];\n\n/** Pegs placed deterministically round the cluster centres, never closer than 11 to each other. */\nfunction scatter() {\n  let s = 7;\n  const rnd = () => ((s = (s * 16807) % 2147483647) / 2147483647);\n  const pegs = [];\n  for (const [cx, cy, h, n] of CL) {\n    let tries = 0;\n    for (let k = 0; k < n && tries < 400; tries++) {\n      const a = rnd() * Math.PI * 2, d = 5 + rnd() * 17, x = cx + Math.cos(a) * d, y = cy + Math.sin(a) * d * 0.8;\n      if (x < X0 + 9 || x > X1 - 9 || y < Y0 + 9 || y > Y1 - 9) continue;\n      if (pegs.some((p) => Math.hypot(p.x - x, p.y - y) < 11)) continue;\n      pegs.push({ x, y, h0: h + rnd() * 2.5 }); k++;\n    }\n  }\n  return pegs;\n}\n\nfunction mount({ stage, svg, read }, value) {\n  const bag = disposer();\n  let K = Math.round(value), q = null;\n\n  const C = Cam(45, 0.5, 1.72);\n  fit(C, [[X0, Y0, -5], [X1, Y1, -5], [X1, Y0, -5], [X0, Y1, -5], [X0 + 12, Y0 + 12, LIFT], [X1 - 12, Y0 + 12, LIFT]], 200, 166);\n  const P = proj(C), front = facing(C);\n\n  const g = mk(\"g\", {}, svg);\n  const [tr, ti] = rings(X0, Y0, X1, Y1, 12, 2);\n  put(solid(g), prism(P, front, tr, ti, -5, 0));\n  const qd = flatDot(g, C, 1.6, \"dot off\");\n\n  const pegs = scatter();\n  pegs.forEach((p, i) => { p.i = i; [p.ring, p.inner] = rings(p.x - R, p.y - R, p.x + R, p.y + R, R, 1.1); p.tw = tween(p.h0); p.drawn = NaN; });\n  pegs.slice().sort((a, b) => a.x + a.y - (b.x + b.y)).forEach((p) => { p.el = solid(g); });\n  const tallest = pegs.reduce((a, b) => (b.h0 > a.h0 ? b : a));\n\n  function draw(p, h) {\n    if (h === p.drawn) return;\n    p.drawn = h;\n    put(p.el, prism(P, front, p.ring, p.inner, 0, h));\n  }\n\n  const B = register(stage, (_dt, now) => {\n    let moving = false;\n <script>
(() => {
/**
 * coin-stacks: six coin stacks on a rounded tray, a portfolio at rest. The
 * pointer picks a stack and the strategy trades into it: it gains coins while
 * its neighbours give some up, staggered outwards from it on the 700ms lift
 * curve. Every coin is a seam on the stack's front. The slider is how many
 * coins one trade moves.
 */
const {
  Cam, clamp, facing, fit, open, poly, prism, proj, ringAt, rings, rrect, run, unproj,
  tween, tset, tval, tdone, mk, pointer, put, register, disposer, solid,
} = HL;

const R = 11, T = 3.2, GAP = 31, STEP = 45;
const REST = [[7, 11, 5], [10, 4, 8]];
const X0 = -R - 9, X1 = 2 * GAP + R + 9, Y0 = -R - 9, Y1 = GAP + R + 9;

function mount({ stage, svg, read }, value) {
  const bag = disposer();
  let gain = value, act = -1;

  const C = Cam(45, 0.5, 2.3);
  const tops = [];
  for (let j = 0; j < 2; j++) for (let i = 0; i < 3; i++) tops.push([i * GAP, j * GAP, (11 + 8) * T]);
  fit(C, [[X0, Y0, -5], [X1, Y1, -5], [X1, Y0, -5], [X0, Y1, -5], ...tops], 200, 166);
  const P = proj(C), front = facing(C);

  const g = mk("g", {}, svg);
  const [pr, pi] = rings(X0, Y0, X1, Y1, 12, 2);
  put(solid(g), prism(P, front, pr, pi, -5, 0));

  // back to front: ascending i + j
  const stacks = [];
  for (let j = 0; j < 2; j++) for (let i = 0; i < 3; i++) {
    const x = i * GAP, y = j * GAP, [ring, inner] = rings(x - R, y - R, x + R, y + R, R, 1.4);
    stacks.push({ i, j, x, y, n0: REST[j][i], ring, inner, rim: rrect(x - R + 3, y - R + 3, x + R - 3, y + R - 3, R - 3, 6) });
  }
  stacks.sort((a, b) => a.i + a.j - (b.i + b.j) || a.i - b.i);
  for (const s of stacks) {
    s.el = solid(g);
    s.seams = mk("path", { class: "nf lo" }, s.el.g);
    s.face = mk("path", { class: "nf lo" }, s.el.g);
    s.tw = tween(s.n0);
    s.drawn = NaN;
  }
  const tallest = stacks.reduce((a, b) => (b.n0 > a.n0 ? b : a));

  function draw(s, n) {
    const h = Math.max(T, n * T);
    if (h === s.drawn) return;
    s.drawn = h;
    put(s.el, prism(P, front, s.ring, s.inner, 0, h));
    const fr = run(s.ring, front), seams = [];
    for (let k = 1; k * T < h - 0.6; k++) seams.push(open(ringAt(P, fr, k * T)));
    s.seams.setAttribute("d", seams.join(""));
    s.face.setAttribute("d", poly(ringAt(P, s.rim, h)));
  }

  const B = register(stage, (_dt, now) => {
    let moving = false;
    for (const s of stacks) { draw(s, tval(s.tw, now)); if (!tdone(s.tw, now)) moving = true; }
    return moving;
  });
  bag.add(B.unregister);

  /** The stack whose rest pose holds the point: its side or its lid, the nearest one winning. */
  function hit([sx, sy]) {
    let best = -1;
    stacks.forEach((s, k) => {
      for (let z = 0; z <= s.n0 * T; z += T / 2) {
        const [x, y] = unproj(C, sx, sy, z);
        if (Math.hypot(x - s.x, y - s.y) <= R) { best = k; break; }
      }
    });
    return best;
  }

  function highlight() {
    const on = act < 0 ? tallest : stacks[act];
    for (const s of stacks) s.el.sil.classList.toggle("hi", s === on);
  }

  function retarget() {
    const now = performance.now(), a = stacks[act];
    for (const s of stacks) {
      if (!a) { tset(s.tw, s.n0, now, 0); continue; }
      const d = Math.hypot(s.i - a.i, s.j - a.j);
      const n = s === a ? s.n0 + gain : s.n0 - Math.round(gain * (d <= 1.01 ? 0.5 : 0.25));
      tset(s.tw, clamp(n, 1, 19), now, d * STEP);
    }
    B.wake();
  }

  function setActive(k) {
    if (k === act) return;
    act = k;
    highlight();
    read.textContent = k < 0 ? "rest" : `stack ${stacks[k].j * 3 + stacks[k].i + 1}`;
    retarget();
  }

  highlight();
  bag.add(pointer(stage, { move: (p) => setActive(hit(p)), leave: () => setActive(-1) }));
  bag.add(() => svg.replaceChildren());

  return {
    set: (v) => { gain = Math.round(v); if (act >= 0) retarget(); },
    destroy: bag.dispose,
  };
}

  name: "coin-stacks",
  means: "A portfolio of coin stacks: pick one and the strategy trades into it, drawing coins from its neighbours.",
  rules: [1, 2, 5, 9],
  range: [2, 5, 8],
  mount,
});
})();

<script>
(() => {
/**
 * stepping-stones: stepping stones laid along a stream that bends across a rounded bed.
 * The pointer is projected onto the bed, and each stone rises toward it by its
 * distance, on its own spring, so the path comes up to meet you wherever you
 * are. At rest the stones make a low swell, the first stone bright. The slider
 * is the reach, in world units.
 */
const {
  Cam, clamp, facing, fit, open, prism, proj, rings, unproj, spring, stepS,
  mk, pointer, put, register, disposer, solid,
} = HL;

const N = 11, L = 160, AMP = 20, HMAX = 17;
const X0 = -12, X1 = L + 12, Y0 = 4, Y1 = 92;
const curve = (t) => [8 + t * (L - 16), 48 + AMP * Math.sin(t * Math.PI * 2)];
const falloff = (u) => (u <= 0 ? 1 : u <= 1 ? 0.1 + 0.9 * (1 - u * u) ** 2 : 0.1);

function mount({ stage, svg, read }, value) {
  const bag = disposer();
  let R = value, over = null;

  const C = Cam(45, 0.5, 2.05);
  fit(C, [[X0, Y0, -5], [X1, Y1, -5], [X1, Y0, -5], [X0, Y1, -5], [X0, Y0, HMAX], [X1, Y0, HMAX]], 200, 166);
  const P = proj(C), front = facing(C);

  const g = mk("g", {}, svg);
  const [br, bi] = rings(X0, Y0, X1, Y1, 14, 2);
  put(solid(g), prism(P, front, br, bi, -5, 0));
  // the stream's two banks, and its line of current, drawn on the bed
  const bank = (off) => {
    const pts = [];
    for (let k = -8; k <= 56; k++) {
      const [x, y] = curve(k / 48);
      if (x > X0 + 3 && x < X1 - 3) pts.push(P(x, clamp(y + off, Y0 + 3, Y1 - 3), 0));
    }
    return open(pts);
  };
  mk("path", { d: bank(-17) + bank(17), class: "nf" }, g);
  mk("path", { d: bank(0), class: "nf dash" }, g);

  const stones = [];
  for (let k = 0; k < N; k++) {
    const t = k / (N - 1), [x, y] = curve(t);
    const w = 14 + 3 * Math.sin(k * 2.3), d = 13 + 2 * Math.cos(k * 1.7);
    const [ring, inner] = rings(x - w / 2, y - d / 2, x + w / 2, y + d / 2, 6, 1.2);
    const h0 = 2.5 + 5 * Math.exp(-((t - 0.25) ** 2) / 0.02) + 3 * Math.exp(-((t - 0.75) ** 2) / 0.015);
    stones.push({ k, x, y, ring, inner, h0, sp: spring(h0, { eps: 0.04 }), drawn: NaN });
  }
  stones.slice().sort((a, b) => a.x + a.y - (b.x + b.y)).forEach((s) => { s.el = solid(g); });
  const first = stones[0];

  function draw(s) {
    const h = Math.max(0.8, s.sp.x);
    if (h === s.drawn) return;
    s.drawn = h;
    put(s.el, prism(P, front, s.ring, s.inner, 0, h));
  }
  function highlight() {
    for (const s of stones) s.el.sil.classList.toggle("hi", over ? s.sp.t > HMAX * 0.55 : s === first);
  }

  const B = register(stage, (dt) => {
    let m = false;
    for (const s of stones) { if (stepS(s.sp, dt)) m = true; draw(s); }
    return m;
  });
  bag.add(B.unregister);

  function retarget() {
    let near = null, nd = Infinity;
    for (const s of stones) {
      if (!over) { s.sp.t = s.h0; continue; }
      const dist = Math.hypot(s.x - over[0], s.y - over[1]);
      s.sp.t = Math.max(s.h0 * 0.6, HMAX * falloff(dist / R));
      if (dist < nd) { nd = dist; near = s; }
    }
    read.textContent = over ? `stone ${near.k + 1}` : "rest";
    highlight();
    B.wake();
  }

  highlight();
  bag.add(pointer(stage, {
    move: (p) => { over = unproj(C, p[0], p[1], 0); retarget(); },
    leave: () => { over = null; retarget(); },
  }));
  bag.add(() => svg.replaceChildren());

  return {
    set: (v) => { R = v; if (over) retarget(); },
    destroy: bag.dispose,
  };
}

hairline({
  name: "stepping-stones",
  means: "Stepping stones across a stream: the ones near the pointer rise to meet it, so the path adapts to where you are.",
  rules: [1, 3, 5, 9],
  range: [20, 34, 56],
  mount,
});
})();

    // bottom to top, so a drawer above covers the one below it
    for (let r = ROWS - 1; r >= 0; r--) {
      const z0 = (ROWS - 1 - r) * RH + 1.6, z1 = z0 + RH - 3.2;
      const rest = AJAR[c][0] === r ? AJAR[c][1] : 0;
      drawers[r] = { r, z0, z1, rest, tw: tween(rest), el: solid(g), pull: mk("path", { class: "nf" }, g), drawn: NaN };
    }
    cabs.push({ c, x0, x1, drawers });
  }
  const restMark = cabs[2].drawers[AJAR[2][0]];

  function draw(cab, d, e) {
    if (e === d.drawn) return;
    d.drawn = e;
    const yf = D + 0.8 + e, [ring, inner] = rings(cab.x0 + 2.5, D - 3, cab.x1 - 2.5, yf, 2.2, 1);
    put(d.el, prism(P, front, ring, inner, d.z0, d.z1));
    const cx = (cab.x0 + cab.x1) / 2, zc = (d.z0 + d.z1) / 2 + 1.5;
    d.pull.setAttribute("d", poly(rrect(cx - 6, zc - 1.3, cx + 6, zc + 1.3, 1.3, 3).map((q) => P(q.u, yf, q.v))));
  }

  const B = register(stage, (_dt, now) => {
    let moving = false;
    for (const cab of cabs) for (const d of cab.drawers) {
      draw(cab, d, tval(d.tw, now));
      if (!tdone(d.tw, now)) moving = true;
    }
    return moving;
  });
  bag.add(B.unregister);

  // The front faces at rest, as parallelograms: the pointer in each face's own (x, z).
  const o = P(0, D, 0), ex = P(1, D, 0), ez = P(0, D, 1);
  const a = [ex[0] - o[0], ex[1] - o[1]], b = [ez[0] - o[0], ez[1] - o[1]], det = a[0] * b[1] - a[1] * b[0];
  function hit([sx, sy]) {
    const qx = sx - o[0], qy = sy - o[1];
    const x = (qx * b[1] - qy * b[0]) / det, z = (a[0] * qy - a[1] * qx) / det;
    if (z < 0 || z > H) return null;
    const cab = cabs.find((k) => x >= k.x0 - 2 && x <= k.x1 + 2);
    return cab ? { c: cab.c, r: clamp(ROWS - 1 - Math.floor(z / RH), 0, ROWS - 1) } : null;
  }

  function apply() {
    const now = performance.now();
    for (const cab of cabs) for (const d of cab.drawers) {
      const to = !act ? d.rest : d.r === act.r ? OPEN : 0;
      tset(d.tw, to, now, act ? Math.abs(cab.c - act.c) * STEP : 0);
      d.el.sil.classList.toggle("hi", act ? cab.c === act.c && d.r === act.r : d === restMark);
    }
    read.textContent = act ? `drawer ${act.r + 1}` : "rest";
    B.wake();
  }

  function setActive(h) {
    if ((h && act && h.c === act.c && h.r === act.r) || (!h && !act)) return;
    act = h;
    apply();
  }

  apply();
  bag.add(pointer(stage, { move: (p) => setActive(hit(p)), leave: () => setActive(null) }));
  bag.add(() => svg.replaceChildren());

  return {
    set: (v) => { OPEN = v; if (act) apply(); },
    destroy: bag.dispose,
  };
}

hairline({
  name: "cabinets",
  means: "Three cabinets out of sync: pick a drawer on one and the same drawer slides out of every machine.",
  rules: [1, 2, 3, 5],
  range: [10, 18, 26],
  mount,
});
})();
</script>
<script>
(() => {
/**
 * nearest-pegs: a tray of pegs scattered in three loose clusters, an embedding space
 * seen from above. The pointer is the query, projected onto the tray floor; the
 * k pegs nearest to it rise, the nearest tallest, staggered by rank on the
 * 700ms lift curve. A dot marks the query on the floor. At rest the clusters
 * stand at their own heights, the tallest bright. The slider is k.
 */
const {
  Cam, facing, fit, prism, proj, rings, unproj, clamp,
  tween, tset, tval, tdone, flatDot, mk, place, pointer, put, register, disposer, solid,
} = HL;

const R = 4.6, X0 = -8, X1 = 158, Y0 = -8, Y1 = 118, LIFT = 34, STEP = 40;
const CL = [[34, 32, 4, 7], [118, 30, 12, 6], [80, 88, 7, 7]];

/** Pegs placed deterministically round the cluster centres, never closer than 11 to each other. */
function scatter() {
  let s = 7;
  const rnd = () => ((s = (s * 16807) % 2147483647) / 2147483647);
  const pegs = [];
  for (const [cx, cy, h, n] of CL) {
    let tries = 0;
    for (let k = 0; k < n && tries < 400; tries++) {
      const a = rnd() * Math.PI * 2, d = 5 + rnd() * 17, x = cx + Math.cos(a) * d, y = cy + Math.sin(a) * d * 0.8;
      if (x < X0 + 9 || x > X1 - 9 || y < Y0 + 9 || y > Y1 - 9) continue;
      if (pegs.some((p) => Math.hypot(p.x - x, p.y - y) < 11)) continue;
      pegs.push({ x, y, h0: h + rnd() * 2.5 }); k++;
    }
  }
  return pegs;
}

function mount({ stage, svg, read }, value) {
  const bag = disposer();
  let K = Math.round(value), q = null;

  const C = Cam(45, 0.5, 1.72);
  fit(C, [[X0, Y0, -5], [X1, Y1, -5], [X1, Y0, -5], [X0, Y1, -5], [X0 + 12, Y0 + 12, LIFT], [X1 - 12, Y0 + 12, LIFT]], 200, 166);
  const P = proj(C), front = facing(C);

  const g = mk("g", {}, svg);
  const [tr, ti] = rings(X0, Y0, X1, Y1, 12, 2);
  put(solid(g), prism(P, front, tr, ti, -5, 0));
  const qd = flatDot(g, C, 1.6, "dot off");

  const pegs = scatter();
  pegs.forEach((p, i) => { p.i = i; [p.ring, p.inner] = rings(p.x - R, p.y - R, p.x + R, p.y + R, R, 1.1); p.tw = tween(p.h0); p.drawn = NaN; });
  pegs.slice().sort((a, b) => a.x + a.y - (b.x + b.y)).forEach((p) => { p.el = solid(g); });
  const tallest = pegs.reduce((a, b) => (b.h0 > a.h0 ? b : a));

  function draw(p, h) {
    if (h === p.drawn) return;
    p.drawn = h;
    put(p.el, prism(P, front, p.ring, p.inner, 0, h));
  }

  const B = register(stage, (_dt, now) => {
    let moving = false;
    for (const p of pegs) { draw(p, tval(p.tw, now)); if (!tdone(p.tw, now)) moving = true; }
    return moving;
  });
  bag.add(B.unregister);

  function retarget() {
    const now = performance.now();
    if (!q) {
      for (const p of pegs) { tset(p.tw, p.h0, now, 0); p.el.sil.classList.toggle("hi", p === tallest); }
      qd.setAttribute("class", "dot off");
      place(qd, P((X0 + X1) / 2, (Y0 + Y1) / 2, 0));
      read.textContent = "rest";
      B.wake();
      return;
    }
    const ranked = pegs.map((p) => [Math.hypot(p.x - q[0], p.y - q[1]), p]).sort((a, b) => a[0] - b[0]);
    ranked.forEach(([, p], r) => {
      const inSet = r < K;
      tset(p.tw, inSet ? LIFT * (1 - (0.55 * r) / Math.max(1, K - 1)) : 3, now, inSet ? r * STEP : 0);
      p.el.sil.classList.toggle("hi", r === 0);
    });
    qd.setAttribute("class", "dot m");
    place(qd, P(q[0], q[1], 0));
    read.textContent = `peg ${ranked[0][1].i + 1}`;
    B.wake();
  }

  retarget();
  bag.add(pointer(stage, {
    move: (p) => { const w = unproj(C, p[0], p[1], 0); q = [clamp(w[0], X0, X1), clamp(w[1], Y0, Y1)]; retarget(); },
    leave: () => { q = null; retarget(); },
  }));
  bag.add(() => svg.replaceChildren());

  return {
    set: (v) => { K = Math.round(v); if (q) retarget(); },
    destroy: bag.dispose,
  };
}

hairline({
  name: "nearest-pegs",
  means: "Pegs scattered like embeddings: the pointer is the query, and the k nearest rise, the nearest tallest.",
  rules: [1, 2, 4, 5],
  range: [3, 6, 10],
  mount,
});
})();
</script>
<script>
(() => {
/**
 * gate: five lanes of crates, the agents' output, queued on one plinth
 * behind a single gate, which is you. Two floor lines funnel the lanes into
 * it. At rest the gate is empty and its lintel is bright. The pointer picks a
 * lane: its queue merges into single file and presses into the gate,
 * staggered back from the front, while the other lanes wait. The
 * slider is the stagger, in ms.
 */
const {
  Cam, facing, fit, lerp, open, prism, proj, rings, ringAt, run, unproj,
  tween, tset, tval, tdone, mk, pointer, put, register, disposer, solid,
} = HL;

const CW = 12, CH = 12, G = 24, PITCH = 19, FRONT = 100, GX = 156, YM = 2 * G;
const LEN = [3, 5, 2, 4, 2];
const X0 = FRONT - 4 * PITCH - 13, X1 = GX + 16, Y0 = -14, Y1 = 4 * G + 14, PH = 22;

function mount({ stage, svg, read }, value) {
  const bag = disposer();
  let stag = value, act = -1;

  const C = Cam(45, 0.5, 1.75);
  fit(C, [[X0, Y0, -5], [X1, Y1, -5], [X1, Y0, -5], [X0, Y1, -5], [GX, YM, PH + 4]], 200, 166);
  const P = proj(C), front = facing(C);

  const g = mk("g", {}, svg);
  const [pr, pi] = rings(X0, Y0, X1, Y1, 10, 2);
  put(solid(g), prism(P, front, pr, pi, -5, 0));
  const w = CW / 2 + 4, lanes = [];
  for (let k = 0; k <= LEN.length; k++) lanes.push(open([P(X0 + 6, (k - 0.5) * G, 0), P(FRONT + 10, (k - 0.5) * G, 0)]));
  mk("path", { d: lanes.join(""), class: "nf lo" }, g);
  mk("path", { d: open([P(FRONT + 10, -G / 2, 0), P(GX - 14, YM - w, 0), P(GX - 3, YM - w, 0)]) + open([P(FRONT + 10, 4.5 * G, 0), P(GX - 14, YM + w, 0), P(GX - 3, YM + w, 0)]), class: "nf" }, g);

  const crates = [];
  LEN.forEach((n, lane) => { for (let k = 0; k < n; k++) crates.push({ lane, k, x: tween(FRONT - k * PITCH), y: tween(lane * G), drawn: "" }); });
  const post = (y) => rings(GX - 2, y - 2, GX + 2, y + 2, 2, 0.6);
  const parts = [
    ...crates.map((c) => ({ c, el: solid(g) })),
    { key: GX + YM - w - 1, ring: post(YM - w - 2), el: solid(g) },
    { key: GX + YM + w + 1, ring: post(YM + w + 2), el: solid(g) },
  ];
  crates.forEach((c, i) => { c.el = parts[i].el; c.strap = mk("path", { class: "nf lo" }, c.el.g); });
  for (const p of parts.slice(-2)) put(p.el, prism(P, front, p.ring[0], p.ring[1], 0, PH));
  const lintel = solid(g), [lr, li] = rings(GX - 2.5, YM - w - 4, GX + 2.5, YM + w + 4, 2, 0.7);
  put(lintel, prism(P, front, lr, li, PH, PH + 4));

  /** Paints back to front by where each part is headed. */
  function order() {
    parts.sort((a, b) => (a.c ? a.c.x.to + a.c.y.to : a.key) - (b.c ? b.c.x.to + b.c.y.to : b.key));
    for (const p of parts) g.insertBefore(p.el.g, lintel.g);
  }

  function draw(c, x, y) {
    const key = x.toFixed(2) + "," + y.toFixed(2);
    if (key === c.drawn) return;
    c.drawn = key;
    const [ring, inner] = rings(x - CW / 2, y - CW / 2, x + CW / 2, y + CW / 2, 2.4, 1);
    put(c.el, prism(P, front, ring, inner, 0, CH));
    c.strap.setAttribute("d", open(ringAt(P, run(ring, front), CH * 0.45)));
  }

  const B = register(stage, (_dt, now) => {
    let moving = false;
    for (const c of crates) { draw(c, tval(c.x, now), tval(c.y, now)); if (!tdone(c.x, now) || !tdone(c.y, now)) moving = true; }
    return moving;
  });
  bag.add(B.unregister);

  /** The lane whose resting queue holds the point, read at mid-crate height. */
  function hit([sx, sy]) {
    const [x, y] = unproj(C, sx, sy, CH / 2), lane = Math.round(y / G);
    if (lane < 0 || lane >= LEN.length || Math.abs(y - lane * G) > G / 2) return -1;
    return x >= FRONT - (LEN[lane] - 1) * PITCH - CW && x <= FRONT + CW ? lane : -1;
  }

  function setActive(a) {
    if (a === act) return;
    act = a;
    const now = performance.now();
    for (const c of crates) {
      const go = c.lane === a, ly = c.lane * G;
      const [tx, ty] = !go ? [FRONT - c.k * PITCH, ly] : c.k < 3 ? [GX - c.k * PITCH, lerp(YM, ly, [0, 0.25, 0.6][c.k])] : [FRONT - (c.k - 3) * PITCH, ly];
      tset(c.x, tx, now, go ? c.k * stag : 0); tset(c.y, ty, now, go ? c.k * stag : 0);
      c.el.sil.classList.toggle("hi", go && c.k === 0);
    }
    lintel.sil.classList.toggle("hi", a < 0);
    order();
    read.textContent = a < 0 ? "rest" : `lane ${a + 1}`;
    B.wake();
  }

  lintel.sil.classList.add("hi");
  order();
  bag.add(pointer(stage, { move: (p) => setActive(hit(p)), leave: () => setActive(-1) }));
  bag.add(() => svg.replaceChildren());

  return {
    set: (v) => { stag = v; },
    destroy: bag.dispose,
  };
}

hairline({
  name: "gate",
  means: "Five lanes of work queued behind one gate: pick a lane and its queue merges into the gate in single file.",
  rules: [1, 2, 4, 6],
  range: [0, 45, 90],
  mount,
});
})();
</script>
<script>
(() => {
/**
 * chat-thread: a phone lying on the desk, and the thread rising off its screen:
 * four message bubbles stepping up and away, tails left for the agent and
 * right for you. The agent's first message, the highest, is bright at rest.
 * The pointer picks a bubble (each tested on its resting plane): it lifts and
 * takes the bright edge, and the thread parts round it, staggered outwards.
 * The slider is the gap it opens.
 */
const {
  Cam, facing, fillet, fit, poly, prism, proj, rings, rrect, seg, unproj,
  tween, tset, tval, tdone, mk, pointer, put, register, disposer, solid,
} = HL;

const PW = 46, PL = 88, BW = 32, BH = 15, LIFT = 7, STEP = 50;
// x0, y0 of each bubble, its height, and which side its tail is on (1 is the agent)
const BUB = [[5, 4, 50, 1], [10, 24, 39, 0], [5, 44, 28, 1], [5, 64, 17, 1]];

function outline(x0, y0, left) {
  const x1 = x0 + BW, y1 = y0 + BH;
  const pts = left
    ? [[x0, y0], [x1, y0], [x1, y1], [x0 + 9, y1], [x0 - 3, y1 + 7], [x0, y1 - 5]]
    : [[x0, y0], [x1, y0], [x1, y1 - 5], [x1 + 3, y1 + 7], [x1 - 9, y1], [x0, y1]];
  return fillet(pts, left ? [3, 3, 3, 1.5, 0.8, 1.5] : [3, 3, 1.5, 0.8, 1.5, 3]);
}

function mount({ stage, svg, read }, value) {
  const bag = disposer();
  let gap = value, act = -1;

  const C = Cam(45, 0.5, 2.5);
  fit(C, [[-4, -14, 0], [PW + 4, PL + 14, 0], [PW + 4, -14, 0], [-4, PL + 14, 0], [0, -14, 50 + LIFT], [PW, -14, 50 + LIFT]], 200, 166);
  const P = proj(C), front = facing(C);

  const g = mk("g", {}, svg);
  const [pr, pi] = rings(0, 0, PW, PL, 8, 1.6);
  put(solid(g), prism(P, front, pr, pi, 0, 5));
  const top = (r) => poly(r.map((q) => P(q.u, q.v, 5)));
  mk("path", { d: top(rrect(3.5, 9, PW - 3.5, PL - 9, 3, 4)), class: "nf lo" }, g);
  mk("path", { d: top(rrect(PW / 2 - 6, 3.6, PW / 2 + 6, 5.6, 1, 3)), class: "nf lo" }, g);

  const bubbles = BUB.map(([x0, y0, z, agent], i) => {
    const grp = mk("g", {}, g);
    return {
      i, x0, y0, z, agent, shape: outline(0, 0, agent === 1),
      under: mk("path", { class: "lo" }, grp), face: mk("path", { class: "sil" }, grp), lines: mk("path", { class: "nf lo" }, grp),
      y: tween(y0), h: tween(z), drawn: "",
    };
  });

  function draw(b, y, z) {
    const key = y.toFixed(2) + "," + z.toFixed(2);
    if (key === b.drawn) return;
    b.drawn = key;
    const at = (zz) => b.shape.map(([u, v]) => P(b.x0 + u, y + v, zz));
    b.under.setAttribute("d", poly(at(z - 2.4)));
    b.face.setAttribute("d", poly(at(z)));
    const w = (u, v) => P(b.x0 + u, y + v, z);
    b.lines.setAttribute("d", seg(w(5, 5), w(BW - 5, 5)) + seg(w(5, 10), w(BW - 13, 10)));
  }

  const B = register(stage, (_dt, now) => {
    let moving = false;
    for (const b of bubbles) { draw(b, tval(b.y, now), tval(b.h, now)); if (!tdone(b.y, now) || !tdone(b.h, now)) moving = true; }
    return moving;
  });
  bag.add(B.unregister);

  /** The bubble whose resting plane holds the point; the nearer one wins where two overlap. */
  function hit([sx, sy]) {
    let best = -1;
    for (const b of bubbles) {
      const [x, y] = unproj(C, sx, sy, b.z);
      if (x >= b.x0 - 3 && x <= b.x0 + BW + 3 && y >= b.y0 - 3 && y <= b.y0 + BH + 4) best = b.i;
    }
    return best;
  }

  function setActive(a) {
    if (a === act) return;
    const now = performance.now(), from = a >= 0 ? a : act;
    act = a;
    for (const b of bubbles) {
      const dy = a < 0 || b.i === a ? 0 : b.i < a ? -gap : gap, delay = Math.abs(b.i - from) * STEP;
      tset(b.y, b.y0 + dy, now, delay);
      tset(b.h, b.z + (b.i === a ? LIFT : 0), now, delay);
      b.face.classList.toggle("hi", a < 0 ? b.i === 0 : b.i === a);
    }
    read.textContent = a < 0 ? "rest" : `msg ${a + 1}`;
    B.wake();
  }

  bubbles[0].face.classList.add("hi");
  bag.add(pointer(stage, { move: (p) => setActive(hit(p)), leave: () => setActive(-1) }));
  bag.add(() => svg.replaceChildren());

  return {
    set: (v) => { gap = v; const a = act; act = -2; setActive(a); },
    destroy: bag.dispose,
  };
}

hairline({
  name: "chat-thread",
  means: "A phone and the thread rising off it, the agent's message first: pick a bubble and it lifts out of the thread.",
  rules: [1, 2, 4, 5],
  range: [4, 9, 15],
  mount,
});
})();
</script>
<script>
(() => {
/**
 * voice-bars: a voice, as one row of rounded bars on a long plinth. At rest the
 * bars hold the envelope of a spoken phrase, the loudest bright. The pointer's
 * screen x is a moment in the phrase (screen x does not depend on height, so
 * it reads the same over a tall bar as over the floor); the bars round it
 * swell on their springs, the reach falling off with distance, and the one
 * under it takes the bright edge. The slider is the reach, in bars.
 */
const {
  Cam, clamp, facing, fit, open, prism, proj, rings, ringAt, run, spring, stepS,
  mk, pointer, put, register, disposer, solid,
} = HL;

const H0 = [5, 9, 16, 27, 20, 37, 26, 13, 31, 44, 29, 17, 24, 11, 7, 13, 5];
const N = H0.length, PITCH = 10, BW = 6.4, BD = 15, HMAX = 58;
const L = (N - 1) * PITCH, X0 = -12, X1 = L + 12, Y0 = -14, Y1 = BD + 14;
const falloff = (u) => (u >= 1 ? 0 : (1 - u * u) ** 2);

function mount({ stage, svg, read }, value) {
  const bag = disposer();
  let R = value * PITCH, at = null;

  const C = Cam(45, 0.5, 1.75);
  fit(C, [[X0, Y0, -6], [X1, Y1, -6], [X1, Y0, -6], [X0, Y1, -6], [0, 0, HMAX], [L, 0, HMAX]], 200, 166);
  const P = proj(C), front = facing(C);

  const g = mk("g", {}, svg);
  const [pr, pi] = rings(X0, Y0, X1, Y1, 13, 2);
  put(solid(g), prism(P, front, pr, pi, -6, 0));
  // a groove the bars stand in
  const [gr] = rings(-7, -3, L + 7, BD + 3, 7, 1);
  mk("path", { d: open(ringAt(P, run(gr, (q) => !front(q)), 0)), class: "nf lo" }, g);

  const bars = H0.map((h0, i) => {
    const x = i * PITCH, [ring, inner] = rings(x - BW / 2, 0, x + BW / 2, BD, BW / 2, 1);
    return { i, x, h0, ring, inner, sp: spring(h0, { eps: 0.04 }), el: solid(g), drawn: NaN };
  });
  mk("path", { d: open(ringAt(P, run(gr, front), 0)), class: "nf lo" }, g);
  const loudest = bars.reduce((a, b) => (b.h0 > a.h0 ? b : a));

  function draw(b) {
    const h = Math.max(1, b.sp.x);
    if (h === b.drawn) return;
    b.drawn = h;
    put(b.el, prism(P, front, b.ring, b.inner, 0, h));
  }

  const B = register(stage, (dt) => {
    let m = false;
    for (const b of bars) { if (stepS(b.sp, dt)) m = true; draw(b); }
    return m;
  });
  bag.add(B.unregister);

  // world x along the row from screen x: a straight line, the same at every height
  const s0 = P(0, BD / 2, 0)[0], s1 = P(L, BD / 2, 0)[0];
  const toX = (sx) => ((sx - s0) / (s1 - s0)) * L;

  function retarget() {
    for (const b of bars) {
      const f = at === null ? 0 : falloff(Math.abs(b.x - at) / R);
      b.sp.t = at === null ? b.h0 : b.h0 * 0.55 + (HMAX - b.h0 * 0.55) * f;
    }
    const near = at === null ? loudest : bars[clamp(Math.round(at / PITCH), 0, N - 1)];
    for (const b of bars) b.el.sil.classList.toggle("hi", b === near);
    read.textContent = at === null ? "rest" : `bar ${near.i + 1}`;
    B.wake();
  }

  retarget();
  bag.add(pointer(stage, {
    move: (p) => { at = clamp(toX(p[0]), -PITCH, L + PITCH); retarget(); },
    leave: () => { at = null; retarget(); },
  }));
  bag.add(() => svg.replaceChildren());

  return {
    set: (v) => { R = v * PITCH; if (at !== null) retarget(); },
    destroy: bag.dispose,
  };
}

hairline({
  name: "voice-bars",
  means: "A voice as a row of bars: the phrase swells wherever the pointer listens, falling off with distance.",
  rules: [1, 3, 5, 9],
  range: [1.5, 3, 5.5],
  mount,
});
})();

<script>
(() => {
/**
 * note-grid: twelve note cards on a desk, research half sorted. Each card has
 * a slot in a 4 × 3 grid and a scattered pose, a turn and a slip, and its own
 * spring between the two. The far corner is already in order at rest, its
 * first card bright. The pointer is projected onto the desk, and the cards near
 * it fall into their slots, the pull falling off with distance from each
 * slot, which never moves. The slider is the reach.
 */
const {
  Cam, clamp, facing, fillet, fit, poly, prism, proj, rad, rings, seg, unproj, spring, stepS,
  mk, pointer, put, register, disposer, solid,
} = HL;

const NI = 4, NJ = 3, PX = 29, PY = 25, TW = 19, TD = 14, TK = 1.8;
const X0 = -12, X1 = NI * PX + 4, Y0 = -12, Y1 = NJ * PY + 4;
const falloff = (u) => (u >= 1 ? 0 : (1 - u * u) ** 2);

function mount({ stage, svg, read }, value) {
  const bag = disposer();
  let R = value, over = null;

  const C = Cam(45, 0.5, 2.05);
  fit(C, [[X0, Y0, -5], [X1, Y1, -5], [X1, Y0, -5], [X0, Y1, -5], [X0, Y0, 6]], 200, 166);
  const P = proj(C), front = facing(C);

  const g = mk("g", {}, svg);
  const [dr, di] = rings(X0, Y0, X1, Y1, 10, 2);
  put(solid(g), prism(P, front, dr, di, -5, 0));
  // the grid the notes belong in, ruled on the desk under them
  const slots = [];
  for (let i = 0; i < NI; i++) for (let j = 0; j < NJ; j++) {
    const [r] = rings(i * PX - 1, j * PY - 1, i * PX + TW + 1, j * PY + TD + 1, 2.5, 0.5);
    slots.push(poly(r.map((q) => P(q.u, q.v, 0))));
  }
  mk("path", { d: slots.join(""), class: "nf dash" }, g);

  const cards = [];
  let s = 11;
  const rnd = () => ((s = (s * 16807) % 2147483647) / 2147483647) * 2 - 1;
  for (let k = 0; k <= NI + NJ - 2; k++) for (let i = 0; i < NI; i++) {
    const j = k - i;
    if (j < 0 || j >= NJ) continue;
    const cx = i * PX + TW / 2, cy = j * PY + TD / 2, m0 = clamp(1 - (i + j) * 0.45, 0, 1);
    const grp = mk("g", {}, g);
    cards.push({
      i, j, cx, cy, m0, dx: rnd() * 10, dy: rnd() * 7, th: rnd() * 50, sp: spring(m0, { eps: 0.002 }),
      under: mk("path", { class: "lo" }, grp), face: mk("path", { class: "sil" }, grp), lines: mk("path", { class: "nf lo" }, grp), drawn: NaN,
    });
  }
  const corner = cards[0];

  function draw(c) {
    const m = clamp(c.sp.x, 0, 1);
    if (m === c.drawn) return;
    c.drawn = m;
    const th = rad(c.th * (1 - m)), co = Math.cos(th), si = Math.sin(th);
    const ox = c.cx + c.dx * (1 - m), oy = c.cy + c.dy * (1 - m);
    const w = (u, v, z) => P(ox + u * co - v * si, oy + u * si + v * co, z);
    const shape = fillet([[-TW / 2, -TD / 2], [TW / 2, -TD / 2], [TW / 2, TD / 2], [-TW / 2, TD / 2]], [2, 2, 2, 2]);
    c.under.setAttribute("d", poly(shape.map(([u, v]) => w(u, v, 0))));
    c.face.setAttribute("d", poly(shape.map(([u, v]) => w(u, v, TK))));
    c.lines.setAttribute("d", [-3.5, 0, 3.5].map((v, k) => seg(w(-TW / 2 + 3, v, TK), w(TW / 2 - (k === 2 ? 8 : 3), v, TK))).join(""));
  }

  const B = register(stage, (dt) => {
    let m = false;
    for (const c of cards) { if (stepS(c.sp, dt)) m = true; draw(c); }
    return m;
  });
  bag.add(B.unregister);

  function retarget() {
    let near = corner, nd = Infinity;
    for (const c of cards) {
      if (!over) { c.sp.t = c.m0; continue; }
      const d = Math.hypot(c.cx - over[0], c.cy - over[1]);
      c.sp.t = Math.max(c.m0, falloff(d / R));
      if (d < nd) { nd = d; near = c; }
    }
    for (const c of cards) c.face.classList.toggle("hi", c === near);
    read.textContent = over ? `note ${near.i + 1}·${near.j + 1}` : "rest";
    B.wake();
  }

  retarget();
  bag.add(pointer(stage, {
    move: (p) => { over = unproj(C, p[0], p[1], 0); retarget(); },
    leave: () => { over = null; retarget(); },
  }));
  bag.add(() => svg.replaceChildren());

  return {
    set: (v) => { R = v; if (over) retarget(); },
    destroy: bag.dispose,
  };
}

hairline({
  name: "note-grid",
  means: "Research notes scattered on a desk: near the pointer they fall into order, a grid of structured notes.",
  rules: [1, 3, 5, 6],
  range: [22, 40, 60],
  mount,
});
})();
</script>
<script>
(() => {
/**
 * platforms: three platforms in a row, tied by two planks that rest on their
 * tops. At rest they stand at three heights and the planks slope between
 * them; the middle one is bright. The pointer picks a platform (each tested
 * on its resting pose), and the other two rise or sink to its level,
 * staggered outwards from it, until the planks lie flat: one surface. Each
 * lid carries its number in dots. The slider is the stagger, in ms.
 */
const {
  Cam, facing, fit, poly, prism, proj, rings, unproj,
  tween, tset, tval, tdone, flatDot, mk, place, pointer, put, register, disposer, solid,
} = HL;

const W = 36, D = 42, GAP = 18, H0 = [36, 24, 12], PY0 = 13, PY1 = D - 13, PK = 1.6;
const X = (i) => i * (W + GAP), X1 = 2 * (W + GAP) + W;

function mount({ stage, svg, read }, value) {
  const bag = disposer();
  let stag = value, act = -1;

  const C = Cam(45, 0.5, 1.95);
  fit(C, [[-8, -8, -5], [X1 + 8, D + 8, -5], [X1 + 8, -8, -5], [-8, D + 8, -5], [0, 0, 36], [X1, 0, 36]], 200, 166);
  const P = proj(C), front = facing(C);

  const g = mk("g", {}, svg);
  const [br, bi] = rings(-8, -8, X1 + 8, D + 8, 10, 2);
  put(solid(g), prism(P, front, br, bi, -5, 0));

  const plats = H0.map((h0, i) => {
    const [ring, inner] = rings(X(i), 0, X(i) + W, D, 5, 1.6);
    const el = solid(g), lid = mk("path", { class: "nf lo" }, el.g), dots = [];
    for (let k = 0; k <= i; k++) dots.push(flatDot(el.g, C, 1.3, "dot off"));
    return { i, h0, ring, inner, lid, dots, el, tw: tween(h0), drawn: NaN };
  });
  const planks = [0, 1].map(() => {
    const grp = mk("g", {}, g);
    return { under: mk("path", { class: "lo" }, grp), face: mk("path", { class: "sil" }, grp) };
  });

  function drawPlat(p, h) {
    if (h === p.drawn) return false;
    p.drawn = h;
    put(p.el, prism(P, front, p.ring, p.inner, 0, h));
    const [lr] = rings(X(p.i) + 5, 5, X(p.i) + W - 5, D - 5, 3, 1);
    p.lid.setAttribute("d", poly(lr.map((q) => P(q.u, q.v, h))));
    p.dots.forEach((el, k) => place(el, P(X(p.i) + W / 2 + (k - p.i / 2) * 5, D - 8.5, h)));
    return true;
  }
  function drawPlank(k, ha, hb) {
    // the high end sits on the taller lid's edge, the low end lies on the lower lid
    const xa = X(k) + W - (ha > hb + 0.5 ? 0 : 7), xb = X(k + 1) + (hb > ha + 0.5 ? 0 : 7), q = (x, y, z) => P(x, y, z);
    planks[k].under.setAttribute("d", poly([q(xa, PY0, ha), q(xb, PY0, hb), q(xb, PY1, hb), q(xa, PY1, ha)]));
    planks[k].face.setAttribute("d", poly([q(xa, PY0, ha + PK), q(xb, PY0, hb + PK), q(xb, PY1, hb + PK), q(xa, PY1, ha + PK)]));
  }

  const B = register(stage, (_dt, now) => {
    let moving = false, changed = false;
    for (const p of plats) { if (drawPlat(p, tval(p.tw, now))) changed = true; if (!tdone(p.tw, now)) moving = true; }
    if (changed) for (let k = 0; k < 2; k++) drawPlank(k, plats[k].drawn, plats[k + 1].drawn);
    return moving;
  });
  bag.add(B.unregister);

  /** The platform whose resting pose holds the point, its side or its lid; the nearer wins. */
  function hit([sx, sy]) {
    let best = -1;
    for (const p of plats) for (let z = 0; z <= p.h0; z += 2) {
      const [x, y] = unproj(C, sx, sy, z);
      if (x >= X(p.i) && x <= X(p.i) + W && y >= 0 && y <= D) { best = p.i; break; }
    }
    return best;
  }

  function setActive(a) {
    if (a === act) return;
    const now = performance.now(), from = a >= 0 ? a : act;
    act = a;
    for (const p of plats) {
      tset(p.tw, a < 0 ? p.h0 : H0[a], now, Math.abs(p.i - from) * stag);
      p.el.sil.classList.toggle("hi", a < 0 ? p.i === 1 : p.i === a);
    }
    read.textContent = a < 0 ? "rest" : `platform ${a + 1}`;
    B.wake();
  }

  plats[1].el.sil.classList.add("hi");
  bag.add(pointer(stage, { move: (p) => setActive(hit(p)), leave: () => setActive(-1) }));
  bag.add(() => svg.replaceChildren());

  return {
    set: (v) => { stag = v; },
    destroy: bag.dispose,
  };
}

hairline({
  name: "platforms",
  means: "Three platforms at three heights, tied by planks: pick one and the others meet its level, until the planks lie flat.",
  rules: [1, 2, 5, 6],
  range: [0, 70, 140],
  mount,
});
})();
</script>
<script>
(() => {
/**
 * tape-reels: the meeting on tape. A reel-to-reel deck lying on the desk, two
 * open reels, the tape running from one round two guide posts past the head
 * and on to the other, and three keys at the front. The pointer's screen x
 * scrubs through the meeting (screen x is the same at every height, and the
 * deck never moves): on a spring, tape winds off one pack onto the other, the
 * packs swell and shrink with it, and the hubs turn. At rest it sits a third
 * of the way in. The head is the one bright mark: now. The slider is how much
 * tape the meeting holds, as the radius of a full pack.
 */
const {
  Cam, clamp, facing, fit, open, poly, prism, proj, rings, rrect, spring, stepS,
  flatDot, mk, place, pointer, put, register, disposer, solid,
} = HL;

const HUB = 6, DZ = 10, FZ = 1.5, PZ = 6, LEN = 46, P0 = 0.35, TURNS = 9;
const LC = [42, 36], RC = [112, 36], GL = [62, 70], GR = [92, 70];
const X0 = -4, X1 = 158, Y0 = -6, Y1 = 82;
const disc = (c, r) => rrect(c[0] - r, c[1] - r, c[0] + r, c[1] + r, r, 14);

/** Where the tape leaves a pack of radius r for the point h, on the side away from the deck's middle. */
function tangent(c, r, h, side) {
  const dx = h[0] - c[0], dy = h[1] - c[1], d = Math.hypot(dx, dy), a = Math.atan2(dy, dx) + side * Math.acos(clamp(r / d, -1, 1));
  return [c[0] + r * Math.cos(a), c[1] + r * Math.sin(a)];
}

function mount({ stage, svg, read }, value) {
  const bag = disposer();
  let RMAX = value;

  const C = Cam(45, 0.5, 2.05);
  fit(C, [[X0, Y0, 0], [X1, Y1, 0], [X1, Y0, 0], [X0, Y1, 0], [X0, Y0, DZ + 10], [X1, Y0, DZ + 10]], 200, 166);
  const P = proj(C), front = facing(C);
  const g = mk("g", {}, svg);

  const [dr, di] = rings(X0, Y0, X1, Y1, 12, 2);
  put(solid(g), prism(P, front, dr, di, 0, DZ));
  const at = (r, z) => poly(r.map((q) => P(q.u, q.v, z)));

  const reel = (c) => {
    const flange = solid(g), pack = solid(g), wind = mk("path", { class: "nf lo" }, pack.g), hub = solid(g);
    const holes = [0, 1, 2].map(() => flatDot(hub.g, C, 0.9, "dot off"));
    return { c, flange, pack, wind, hub, holes, drawn: "" };
  };
  const L = reel(LC), R = reel(RC);
  const tape = mk("path", { class: "nf" }, g);
  for (const p of [GL, GR]) { const [r, i] = rings(p[0] - 2.6, p[1] - 2.6, p[0] + 2.6, p[1] + 2.6, 2.6, 0.8); put(solid(g), prism(P, front, r, i, DZ, DZ + 10)); }
  const head = solid(g), [hr, hi] = rings(71, 63, 83, 72, 2.6, 1);
  put(head, prism(P, front, hr, hi, DZ, DZ + 9));
  head.sil.classList.add("hi");
  // the tape runs across the head's face, so it is painted after it
  g.appendChild(tape);
  for (let k = 0; k < 3; k++) { const [r, i] = rings(118 + k * 11, 64, 126 + k * 11, 72, 2, 0.8); put(solid(g), prism(P, front, r, i, DZ, DZ + 2.4)); }

  const sp = spring(P0, { eps: 0.0005 });
  let drawnP = NaN, drawnR = NaN, over = false;

  function drawReel(rl, r, turn) {
    const z0 = DZ + FZ, z1 = z0 + PZ, fr = RMAX + 3;
    put(rl.flange, prism(P, front, disc(rl.c, fr), disc(rl.c, fr - 1.2), DZ, z0));
    put(rl.pack, prism(P, front, disc(rl.c, r), disc(rl.c, Math.max(HUB, r - 1.2)), z0, z1));
    rl.wind.setAttribute("d", r > HUB + 4 ? at(disc(rl.c, (r + HUB) / 2), z1) : "");
    const [hr0, hi0] = rings(rl.c[0] - HUB, rl.c[1] - HUB, rl.c[0] + HUB, rl.c[1] + HUB, HUB, 1);
    put(rl.hub, prism(P, front, hr0, hi0, z0, z1 + 2.5));
    rl.holes.forEach((el, k) => {
      const a = turn + (k * 2 * Math.PI) / 3;
      place(el, P(rl.c[0] + Math.cos(a) * 3.4, rl.c[1] + Math.sin(a) * 3.4, z1 + 2.5));
    });
  }

  function draw() {
    const p = clamp(sp.x, 0, 1);
    if (p === drawnP && RMAX === drawnR) return;
    drawnP = p; drawnR = RMAX;
    const full = RMAX * RMAX - HUB * HUB;
    const rl = Math.sqrt(HUB * HUB + (1 - p) * full), rr = Math.sqrt(HUB * HUB + p * full);
    drawReel(L, rl, -p * TURNS);
    drawReel(R, rr, -p * TURNS);
    const zt = DZ + FZ + PZ / 2, a = tangent(LC, rl, GL, 1), b = tangent(RC, rr, GR, -1);
    tape.setAttribute("d", open([a, GL, [71, 73.5], [83, 73.5], GR, b].map((q) => P(q[0], q[1], zt))));
    const m = Math.round(p * LEN * 60);
    read.textContent = over ? `${String(Math.floor(m / 60)).padStart(2, "0")}:${String(m % 60).padStart(2, "0")}` : "rest";
  }

  const B = register(stage, (dt) => { const m = stepS(sp, dt); draw(); return m; });
  bag.add(B.unregister);

  // the meeting's position from screen x, between the two hubs
  const s0 = P(LC[0], LC[1], 0)[0], s1 = P(RC[0], RC[1], 0)[0];
  bag.add(pointer(stage, {
    move: (q) => { over = true; sp.t = clamp((q[0] - s0) / (s1 - s0), 0, 1); drawnP = NaN; B.wake(); },
    leave: () => { over = false; sp.t = P0; drawnP = NaN; B.wake(); },
  }));
  bag.add(() => svg.replaceChildren());

  return {
    set: (v) => { RMAX = v; B.wake(); },
    destroy: bag.dispose,
  };
}

hairline({
  name: "tape-reels",
  means: "The meeting on tape: scrub with the pointer and the tape winds from one reel to the other, to that moment.",
  rules: [1, 3, 5, 8],
  range: [17, 21, 25],
  mount,
});
})();
</script>
<script>
(() => {
/**
 * switchboard: a call centre's switchboard, a patch bay of fifteen jacks with six
 * cords arched between pairs of plugs: six calls in progress, three lines
 * free. At rest one cord is bright. The pointer picks a jack (cells on the
 * resting panel, which never moves); if a call is on it, both its plugs pull
 * up, the near one first, and its cord takes the bright stroke, while the
 * plugs round it lift a little less the farther they are. The slider is the lift.
 */
const {
  Cam, clamp, facing, fit, open, prism, proj, rings, rrect, poly, unproj,
  tween, tset, tval, tdone, mk, pointer, put, register, disposer, solid,
} = HL;

const NC = 5, NR = 3, G = 21, PZ = 7, PH = 7, PR = 3.2, STEP = 60;
const CORDS = [[[0, 0], [2, 1]], [[1, 0], [4, 0]], [[3, 1], [1, 2]], [[0, 2], [2, 2]], [[4, 2], [3, 0]], [[0, 1], [2, 0]]];
const X0 = -12, X1 = (NC - 1) * G + 12, Y0 = -12, Y1 = (NR - 1) * G + 12;

function mount({ stage, svg, read }, value) {
  const bag = disposer();
  let LIFT = value, act = null;

  const C = Cam(45, 0.5, 2.2);
  fit(C, [[X0, Y0, 0], [X1, Y1, 0], [X1, Y0, 0], [X0, Y1, 0], [X0, Y0, 40], [X1, Y0, 40]], 200, 166);
  const P = proj(C), front = facing(C);

  const g = mk("g", {}, svg);
  const [pr, pi] = rings(X0, Y0, X1, Y1, 8, 2);
  put(solid(g), prism(P, front, pr, pi, 0, PZ));
  const at = (r, x, y, z) => poly(r.map((q) => P(x + q.u, y + q.v, z)));
  const holes = [], rims = [];
  for (let c = 0; c < NC; c++) for (let r = 0; r < NR; r++) {
    holes.push(at(rrect(-PR - 1.2, -PR - 1.2, PR + 1.2, PR + 1.2, PR + 1.2, 4), c * G, r * G, PZ));
    rims.push(at(rrect(-1.4, -1.4, 1.4, 1.4, 1.4, 3), c * G, r * G, PZ));
  }
  mk("path", { d: holes.join(""), class: "nf" }, g);
  mk("path", { d: rims.join(""), class: "nf lo" }, g);

  const plugs = [], byJack = new Map();
  CORDS.forEach((pair, k) => pair.forEach(([c, r], end) => {
    const p = { k, end, c, r, tw: tween(0), drawn: NaN };
    plugs.push(p); byJack.set(c + "," + r, p);
  }));
  plugs.slice().sort((a, b) => a.c + a.r - (b.c + b.r)).forEach((p) => { p.el = solid(g); });
  const cords = CORDS.map(() => mk("path", { class: "nf" }, g));

  const top = (p) => PZ + PH + p.drawn;
  function drawPlug(p, l) {
    if (l === p.drawn) return false;
    p.drawn = l;
    const [ring, inner] = rings(p.c * G - PR, p.r * G - PR, p.c * G + PR, p.r * G + PR, PR, 0.9);
    put(p.el, prism(P, front, ring, inner, PZ - 1 + l, top(p)));
    return true;
  }
  function drawCord(k) {
    const [a, b] = plugs.filter((p) => p.k === k), pts = [];
    const ax = a.c * G, ay = a.r * G, bx = b.c * G, by = b.r * G, arch = 12 + Math.hypot(bx - ax, by - ay) * 0.22;
    for (let n = 0; n <= 20; n++) {
      const t = n / 20;
      pts.push(P(ax + (bx - ax) * t, ay + (by - ay) * t, top(a) + (top(b) - top(a)) * t + arch * 4 * t * (1 - t)));
    }
    cords[k].setAttribute("d", open(pts));
  }

  const B = register(stage, (_dt, now) => {
    let moving = false;
    const dirty = new Set();
    for (const p of plugs) { if (drawPlug(p, tval(p.tw, now))) dirty.add(p.k); if (!tdone(p.tw, now)) moving = true; }
    dirty.forEach(drawCord);
    return moving;
  });
  bag.add(B.unregister);

  function hit([sx, sy]) {
    const [x, y] = unproj(C, sx, sy, PZ + PH / 2), c = Math.round(x / G), r = Math.round(y / G);
    if (c < 0 || c >= NC || r < 0 || r >= NR || Math.abs(x - c * G) > G / 2 || Math.abs(y - r * G) > G / 2) return null;
    return { c, r };
  }

  function apply() {
    const now = performance.now(), on = act && byJack.get(act.c + "," + act.r);
    for (const p of plugs) {
      const d = act ? Math.hypot(p.c - act.c, p.r - act.r) : 0;
      const l = !on ? 0 : p.k === on.k ? LIFT : LIFT * 0.35 * clamp(1 - d / 2.5, 0, 1);
      tset(p.tw, l, now, act ? d * STEP : 0);
    }
    cords.forEach((el, k) => el.classList.toggle("hi", on ? k === on.k : k === 1));
    read.textContent = act ? `line ${act.r + 1}·${act.c + 1}` : "rest";
    B.wake();
  }
  function setActive(h) {
    if ((h && act && h.c === act.c && h.r === act.r) || (!h && !act)) return;
    act = h;
    apply();
  }

  apply();
  bag.add(pointer(stage, { move: (p) => setActive(hit(p)), leave: () => setActive(null) }));
  bag.add(() => svg.replaceChildren());

  return {
    set: (v) => { LIFT = v; if (act) apply(); },
    destroy: bag.dispose,
  };
}

hairline({
  name: "switchboard",
  means: "A switchboard of six calls in progress: pick a line and its cord pulls up out of the bay.",
  rules: [1, 2, 3, 4],
  range: [6, 12, 18],
  mount,
});
})();
</script>
<script>
(() => {
/**
 * upload-tray: an upload tray with a dashed drop zone, and four files
 * hovering over it in layers, each a sheet with its corner folded. At rest
 * the top file is bright. The pointer picks a file (each tested on its resting
 * plane, the higher winning): it drops into the tray and takes the bright
 * edge, and the files above close the gap it left, staggered outwards from it.
 * The slider is the spacing of the layers.

const {
  Cam, facing, fillet, fit, poly, prism, proj, rings, rrect, seg, unproj,
  tween, tset, tval, tdone, mk, pointer, put, register, disposer, solid,

const N = 4, SW = 30, SL = 38, FOLD = 8, TX0 = -12, TX1 = SW + 22, TY0 = -16, TY1 = SL + 12, TH = 6, BASE = 20, STEP = 50;
const OFF = [[0, 0], [4, -5], [8, -10], [12, -15]];

function mount({ stage, svg, read }, value) {
  const bag = disposer();
  let gap = value, act = -1;

  const C = Cam(45, 0.5, 2.55);
  fit(C, [[TX0, TY0, 0], [TX1, TY1, 0], [TX1, TY0, 0], [TX0, TY1, 0], [12, -15, BASE + 3 * 17 + 2], [12 + SW, -15, BASE + 3 * 17 + 2]], 200, 166);
  const P = proj(C), front = facing(C);

  const g = mk("g", {}, svg);
  const [tr, ti] = rings(TX0, TY0, TX1, TY1, 8, 2);
  put(solid(g), prism(P, front, tr, ti, 0, TH));
  const on = (r, z) => poly(r.map((q) => P(q.u, q.v, z)));

  mk("path", { d: on(rrect(TX0 + 9, TY0 + 9, TX1 - 9, TY1 - 9, 3, 5), TH), class: "nf dash" }, g);

  const files = OFF.map(([dx, dy], i) => {

    f.under.setAttribute("d", poly(SHAPE.map(([u, v]) => w(u, v, z - 1.6))));
    f.face.setAttribute("d", poly(SHAPE.map(([u, v]) => w(u, v, z))));

    f.marks.setAttribute("d", seg(w(SW - FOLD, 0, z), w(SW - FOLD, FOLD, z)) + seg(w(SW - FOLD, FOLD, z), w(SW, FOLD, z)) + rows);
  }

  const B = register(stage, (_dt, now) => {
    let moving = false;
    for (const f of files) { draw(f, tval(f.z, now)); if (!tdone(f.z, now)) moving = true; }
    return moving;
  });
  bag.add(B.unregister);

  /** The file whose resting plane holds the point; the higher one wins where they overlap. */
  function hit([sx, sy]) {
    let best = -1;
    for (const f of files) {
      const [x, y] = unproj(C, sx, sy, restZ(f));
      if (x >= f.dx - 2 && x <= f.dx + SW + 2 && y >= f.dy - 2 && y <= f.dy + SL + 2) best = f.i;
    }
    return best;
  }

  function apply() {
    const now = performance.now(), from = act >= 0 ? act : N - 1;
    for (const f of files) {
      const layer = act < 0 || f.i < act ? f.i : f.i - 1;
      tset(f.z, f.i === act ? TH + 1.6 : BASE + layer * gap, now, Math.abs(f.i - from) * STEP);
      f.face.classList.toggle("hi", act < 0 ? f.i === N - 1 : f.i === act);
    }
    // the dropped file goes under the rest, so the hovering layers still cover it
    const lead = act >= 0 ? files[act].grp : null;
    if (lead) g.insertBefore(lead, files.find((f) => f.i !== act).grp); else files.forEach((f) => g.appendChild(f.grp));
    read.textContent = act < 0 ? "rest" : `file ${act + 1}`;
    B.wake();
  }
  function setActive(a) { if (a !== act) { if (act >= 0) files.forEach((f) => g.appendChild(f.grp)); act = a; apply(); } }

  apply();
  bag.add(pointer(stage, { move: (p) => setActive(hit(p)), leave: () => setActive(-1) }));
  bag.add(() => svg.replaceChildren());

  return {
    set: (v) => { gap = v; apply(); },
    destroy: bag.dispose,
  };
}

  name: "upload-tray",
  means: "Files hovering over an upload tray: pick one and it drops into the drop zone while the rest close up.",
  rules: [1, 2, 4, 6],
  range: [9, 13, 17],
  mount,

  },

  const N = DEV.length, Y1 = (N - 1) * G;
  fit(C, [[-4, -8, 0], [84, Y1 + 10, 0], [84, -8, 0], [-4, Y1 + 10, 0], [0, -8, 60 + LIFT], [80, -8, 56]], 200, 166);
  const P = proj(C), front = facing(C);

    if (dv.notch) m += seg(w(dv.notch[0], dv.notch[2]), w(dv.notch[1], dv.notch[2]));
    if (dv.home) m += seg(w(dv.home[0], dv.home[2]), w(dv.home[1], dv.home[2]));

    let moving = false;
    for (const dv of devs) { draw(dv, tval(dv.a, now), tval(dv.z, now)); if (!tdone(dv.a, now) || !tdone(dv.z, now)) moving = true; }

  const rests = devs.map((dv) => { const { w } = frame(dv, REST, 0); return dv.outline.map(([u, v]) => w(u, v)); });

    let c = false;
    for (let i = 0, j = pts.length - 1; i < pts.length; j = i++) {

  };

    if (a === act) return;
    const now = performance.now(), from = a >= 0 ? a : act;
    act = a;
    devs.forEach((dv, i) => {
      const delay = Math.abs(i - from) * stag;
      tset(dv.a, a < 0 ? REST : i < a ? BACK : i > a ? FWD : 0, now, delay);
      tset(dv.z, i === a ? LIFT : 0, now, delay);
      dv.face.classList.toggle("hi", a < 0 ? dv.name === "phone" : i === a);
    });
    read.textContent = a < 0 ? "rest" : devs[a].name;
    B.wake();
  }

  devs[2].face.classList.add("hi");
  bag.add(pointer(stage, { move: (p) => setActive(hit(p)), leave: () => setActive(-1) }));
  bag.add(() => svg.replaceChildren());

    set: (v) => { stag = v; },
    destroy: bag.dispose,
  };

<script>
(() => {
/**
 * widget-board: a dashboard, seven widget tiles of mixed sizes packed on one board,
 * each lid carrying its widget: bars, a ring, a list, a trend line. At rest
 * the tiles stand at uneven heights, the big chart bright. The pointer picks
 * the tile under it (each tested on its resting lid, the nearest winning);
 * it lifts and takes the bright edge, and the others settle down, staggered
 * outwards from it by distance. The slider is the lift.
 */
const {
  Cam, clamp, facing, fit, open, poly, prism, proj, rings, rrect, seg, unproj,
  tween, tset, tval, tdone, mk, pointer, put, register, disposer, solid,
} = HL;

const U = 24, GP = 3, STEP = 45;
const TILES = [
  [0, 0, 2, 1, "bars", 7], [2, 0, 1, 1, "ring", 4], [3, 0, 1, 2, "list", 5], [0, 1, 1, 2, "list", 3],
  [1, 1, 2, 1, "trend", 6], [1, 2, 1, 1, "ring", 3.5], [2, 2, 2, 1, "bars", 4.5],
];
const X1 = 4 * U, Y1 = 3 * U;

/** The widget drawn on a lid, in the tile's own box: what makes it a dashboard. */
function widget(P, kind, x0, y0, x1, y1, z) {
  const w = (x, y) => P(x, y, z), cx = (x0 + x1) / 2, cy = (y0 + y1) / 2;
  if (kind === "bars") {
    const n = 5, bw = (x1 - x0 - 10) / n, hs = [0.4, 0.7, 0.5, 0.9, 0.6];
    return hs.map((h, k) => { const bx = x0 + 5 + k * bw; return poly([w(bx + 1, y1 - 4), w(bx + bw - 1, y1 - 4), w(bx + bw - 1, y1 - 4 - h * (y1 - y0 - 8)), w(bx + 1, y1 - 4 - h * (y1 - y0 - 8))]); }).join("");
  }
  if (kind === "ring") return poly(rrect(cx - 6, cy - 6, cx + 6, cy + 6, 6, 5).map((q) => w(q.u, q.v))) + poly(rrect(cx - 3, cy - 3, cx + 3, cy + 3, 3, 4).map((q) => w(q.u, q.v)));
  if (kind === "list") return [0, 1, 2, 3, 4].filter((k) => y0 + 6 + k * 8 < y1 - 4).map((k) => seg(w(x0 + 4, y0 + 6 + k * 8), w(x1 - 6, y0 + 6 + k * 8))).join("");
  const pts = [0, 0.5, 0.3, 0.8, 0.6, 1].map((t, k) => w(x0 + 5 + (k * (x1 - x0 - 10)) / 5, y1 - 5 - t * (y1 - y0 - 10)));
  return open(pts);
}

function mount({ stage, svg, read }, value) {
  const bag = disposer();
  let LIFT = value, act = -1;

  const C = Cam(45, 0.5, 2.15);
  fit(C, [[-8, -8, -5], [X1 + 8, Y1 + 8, -5], [X1 + 8, -8, -5], [-8, Y1 + 8, -5], [0, 0, 32], [X1, 0, 32]], 200, 166);
  const P = proj(C), front = facing(C);

  const g = mk("g", {}, svg);
  const [br, bi] = rings(-8, -8, X1 + 8, Y1 + 8, 9, 2);
  put(solid(g), prism(P, front, br, bi, -5, 0));

  const tiles = TILES.map(([c, r, w, h, kind, h0], i) => {
    const x0 = c * U + GP / 2, y0 = r * U + GP / 2, x1 = (c + w) * U - GP / 2, y1 = (r + h) * U - GP / 2;
    const [ring, inner] = rings(x0, y0, x1, y1, 3.5, 1.2);
    return { i, kind, h0, x0, y0, x1, y1, cx: (x0 + x1) / 2, cy: (y0 + y1) / 2, ring, inner, tw: tween(h0), lz: tween(0), drawn: "" };
  });
  const order = tiles.slice().sort((a, b) => a.cx + a.cy - (b.cx + b.cy));
  order.forEach((t) => { t.el = solid(g); t.mark = mk("path", { class: "nf lo" }, t.el.g); });

  function draw(t, h, z) {
    const key = h.toFixed(2) + "," + z.toFixed(2);
    if (key === t.drawn) return;
    t.drawn = key;
    put(t.el, prism(P, front, t.ring, t.inner, z, z + h));
    t.mark.setAttribute("d", widget(P, t.kind, t.x0, t.y0, t.x1, t.y1, z + h));
  }

  const B = register(stage, (_dt, now) => {
    let moving = false;
    for (const t of tiles) { draw(t, tval(t.tw, now), tval(t.lz, now)); if (!tdone(t.tw, now) || !tdone(t.lz, now)) moving = true; }
    return moving;
  });
  bag.add(B.unregister);

  function hit([sx, sy]) {
    let best = -1, bk = -Infinity;
    for (const t of tiles) for (let z = t.h0; z >= 0; z -= 1.5) {
      const [x, y] = unproj(C, sx, sy, z);
      if (x >= t.x0 && x <= t.x1 && y >= t.y0 && y <= t.y1) { if (t.cx + t.cy > bk) { bk = t.cx + t.cy; best = t.i; } break; }
    }
    return best;
  }

  function apply() {
    const now = performance.now(), a = tiles[act];
    for (const t of tiles) {
      const d = a ? Math.hypot(t.cx - a.cx, t.cy - a.cy) / U : 0;
      tset(t.tw, !a || t === a ? t.h0 : clamp(t.h0 * 0.4, 1.5, 3), now, d * STEP);
      tset(t.lz, t === a ? LIFT : 0, now, d * STEP);
      t.el.sil.classList.toggle("hi", a ? t === a : t.i === 0);
    }
    // a lifted tile is above them all, so it is painted last
    order.forEach((t) => g.appendChild(t.el.g));
    if (a) g.appendChild(a.el.g);
    read.textContent = a ? `tile ${act + 1}` : "rest";
    B.wake();
  }

  apply();
  bag.add(pointer(stage, { move: (p) => setActive(hit(p)), leave: () => setActive(-1) }));
  bag.add(() => svg.replaceChildren());

  return {
    set: (v) => { LIFT = v; if (act >= 0) apply(); },
    destroy: bag.dispose,
  };
}

  rules: [1, 2, 5, 9],

  mount,
});
})();

<script>
(() => {
/**
 * toolbox: a cantilever toolbox, a bin, two open trays with their
 * compartments, and a lid with its handle. At rest it stands a little open, the first
 * tray bright. The pointer's screen x opens it, on a spring: each layer rides
 * out over the one below and rises, a staircase that stays centred. Its screen y
 * picks a layer, by bands taken from the resting pose, and that layer takes
 * the bright edge. The slider is how far a layer rides out.
 */
const {
  Cam, clamp, facing, fit, poly, prism, proj, rings, rrect, seg, spring, stepS,
  mk, pointer, put, register, disposer, solid,
} = HL;

const W = 62, D = 32, O0 = 0.3, RISE = 9;
const LAYERS = [["bin", 0, 18], ["tray 1", 18, 25], ["tray 2", 25, 32], ["lid", 32, 36]];

function mount({ stage, svg, read }, value) {
  const bag = disposer();
  let SH = value, pick = -1;

  const C = Cam(45, 0.5, 2.7);
  const E = 1.5 * 26;
  fit(C, [[-E, 0, 0], [W + E, D, 0], [W + E, 0, 0], [-E, D, 0], [-E, 0, 40 + 3 * RISE], [W + E, 0, 40 + 3 * RISE]], 200, 166);
  const P = proj(C), front = facing(C);

  const g = mk("g", {}, svg);

  const layers = LAYERS.map(([name, z0, z1], k) => {
    const el = solid(g);
    return { k, name, z0, z1, el, top: mk("path", { class: "nf lo" }, el.g), handle: k === 3 ? solid(el.g) : null };
  });
  const sp = spring(O0, { eps: 0.001 });
  let drawn = NaN;

  function draw() {
    const o = clamp(sp.x, 0, 1);
    if (o === drawn) return;
    drawn = o;
    // the staircase stays centred: the bin slides back as the lid rides out
    const at = (k) => [(k - 1.5) * o * SH, k * o * RISE];
    layers.forEach((L) => {
      const [dx, dz] = at(L.k), [ring, inner] = rings(dx, 0, dx + W, D, 4, 1.4), zt = L.z1 + dz;
      put(L.el, prism(P, front, ring, inner, L.z0 + dz, zt));
      const on = (r) => poly(r.map((q) => P(q.u, q.v, zt)));
      if (L.handle) {
        const [hr, hi] = rings(dx + W / 2 - 13, D / 2 - 2.2, dx + W / 2 + 13, D / 2 + 2.2, 2.2, 0.7);
        put(L.handle, prism(P, front, hr, hi, zt, zt + 4));
        L.top.setAttribute("d", "");
      } else {
        // an open tray: its rim and the walls between its compartments
        const rim = on(rrect(dx + 3, 3, dx + W - 3, D - 3, 2.5, 4));
        const walls = L.k === 0 ? seg(P(dx + W * 0.4, 3, zt), P(dx + W * 0.4, D - 3, zt)) : seg(P(dx + W / 3, 3, zt), P(dx + W / 3, D - 3, zt)) + seg(P(dx + (2 * W) / 3, 3, zt), P(dx + (2 * W) / 3, D - 3, zt));
        L.top.setAttribute("d", rim + walls);
      }
    });
  }

  const B = register(stage, (dt) => { const m = stepS(sp, dt); draw(); return m; });
  bag.add(B.unregister);

  // the open-ness from screen x, and the layer from screen y in bands taken at rest
  const sx0 = P(-E * 0.6, D / 2, 0)[0], sx1 = P(W + E * 0.6, D / 2, 0)[0];
  const band = layers.map((L) => P(W / 2 + (L.k - 1.5) * O0 * 19, D, (L.z0 + L.z1) / 2 + L.k * O0 * RISE)[1]);
  function choose([sx, sy]) {
    let best = 0;
    band.forEach((y, k) => { if (Math.abs(sy - y) < Math.abs(sy - band[best])) best = k; });
    return best;
  }
  function highlight() {
    layers.forEach((L) => L.el.sil.classList.toggle("hi", pick < 0 ? L.k === 1 : L.k === pick));
  }

  highlight();
  bag.add(pointer(stage, {
    move: (p) => {
      sp.t = clamp((p[0] - sx0) / (sx1 - sx0), 0, 1);
      const k = choose(p);
      if (k !== pick) { pick = k; highlight(); }
      read.textContent = layers[pick].name;
      B.wake();
    },
    leave: () => { sp.t = O0; pick = -1; highlight(); read.textContent = "rest"; B.wake(); },
  }));
  bag.add(() => svg.replaceChildren());

  return {
    set: (v) => { SH = v; drawn = NaN; B.wake(); },
    destroy: bag.dispose,
  };
}

hairline({
  name: "toolbox",
  means: "A cantilever toolbox: the pointer opens it into a staircase of trays and picks the one to reach into.",
  rules: [1, 3, 5, 9],
  range: [12, 19, 26],
  mount,
});
})();

<script>

 */
const {
  Cam, clamp, fit, hull, lerp, open, poly, proj, rrect, run, seg, spring, stepS,
  mk, place, pointer, register, disposer, solid,
} = HL;

const N = 14, H = 26, WD = 13, T = 4.5, F0 = 2.45;
const PIPS = [[], [4], [0, 8], [0, 4, 8], [0, 2, 6, 8], [0, 2, 4, 6, 8], [0, 2, 3, 5, 6, 8]];
const FACES = [[6, 4], [3, 1], [5, 5], [2, 0], [4, 6], [1, 3], [6, 2], [0, 5], [3, 3], [5, 1], [2, 4], [6, 6], [1, 0], [4, 2]];

/** The direction toward the camera, from what P does to the three axes. */
function viewDir(P) {
  const o = P(0, 0, 0), e = [P(1, 0, 0), P(0, 1, 0), P(0, 0, 1)].map((p) => [p[0] - o[0], p[1] - o[1]]);
  const a = e.map((v) => v[0]), b = e.map((v) => v[1]);
  const v = [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]];
  return v[2] < 0 ? v.map((c) => -c) : v;
}

/** A rounded slab: ring and inner in its own (u, v), T thick; at(u, v, t) places it. The crease is the near face's inner run that borders a side. */
function slab(P, V, at, ring, inner, T) {
  const w = (q, t) => P(...at(q.u, q.v, t)), a = at(0, 0, 0), b = at(0, 0, T);
  const tn = (b[0] - a[0]) * V[0] + (b[1] - a[1]) * V[1] + (b[2] - a[2]) * V[2] > 0 ? T : 0, tf = T - tn;
  const n0 = P(...at(0, 0, tn)), f0 = P(...at(0, 0, tf)), o = [f0[0] - n0[0], f0[1] - n0[1]];
  const keep = (q) => { const p = w(q, tn), s = P(...at(q.u + q.nu, q.v + q.nv, tn)); return (s[0] - p[0]) * o[0] + (s[1] - p[1]) * o[1] > 0.01; };
  const r = Math.hypot(o[0], o[1]) > 0.2 ? run(inner, keep) : [];
  return { sil: poly(hull(ring.map((q) => w(q, tn)).concat(ring.map((q) => w(q, tf))))), crease: r.length > 1 ? open(r.map((q) => w(q, tn))) : "", tn };
}

/** The row's pivots: the front foot of each domino and its heading, along an arc. */
function layout(G) {
  const out = [];
  let x = 0, y = 0;
  for (let i = 0; i < N; i++) {
    const ph = lerp(-0.42, 0.5, i / (N - 1));
    out.push({ x, y, hx: Math.cos(ph), hy: Math.sin(ph) });
    const pn = lerp(-0.42, 0.5, (i + 0.5) / (N - 1));
    x += G * Math.cos(pn); y += G * Math.sin(pn);
  }
  const cx = (out[0].x + out[N - 1].x) / 2, cy = (out[0].y + out[N - 1].y) / 2;
  out.forEach((d) => { d.x -= cx; d.y -= cy; });
  return out;
}

/** How far domino i leans to rest its top on the next, leaning by beta, G apart. */
const contact = (beta, G) => beta + Math.asin(clamp((G * Math.cos(beta) - T) / H, -1, 1));

function mount({ stage, svg, read }, value) {
  const bag = disposer();
  let G = value, row = layout(G), pick = -1;

  const C = Cam(45, 0.5, 1.78);
  const far = layout(20);
  fit(C, far.flatMap((d) => [[d.x, d.y, H + 2], [d.x + d.hx * H, d.y + d.hy * H, 0], [d.x - 8, d.y + 8, 0], [d.x + 8, d.y - 8, 0]]), 200, 170);
  const P = proj(C), V = viewDir(P);
  const ring = rrect(-WD / 2, 0, WD / 2, H, 2.2, 4), inner = rrect(-WD / 2 + 1.1, 1.1, WD / 2 - 1.1, H - 1.1, 1.3, 4);

  const g = mk("g", {}, svg);
  const doms = row.map((_, i) => {
    const el = solid(g), line = mk("path", { class: "nf lo" }, el.g), pips = [];
    FACES[i].forEach((n, half) => PIPS[n].forEach((k) => pips.push({ k, half, c: mk("circle", { r: 0, class: "dot m" }, el.g) })));
    return { el, line, pips, drawn: NaN };
  });

  const sp = spring(F0, { eps: 0.002 });
  let lastF = NaN;

  function draw() {
    const F = sp.x;
    if (F === lastF) return;
    lastF = F;
    const al = new Array(N);
    for (let i = N - 1; i >= 0; i--) {
      const f = clamp(F - i, 0, 1), full = i === N - 1 ? Math.PI / 2 : contact(al[i + 1], G);
      al[i] = f * full;
    }
    row.forEach((d, i) => {
      const D = doms[i], a = al[i];
      if (a === D.drawn) return;
      D.drawn = a;
      const s = Math.sin(a), c = Math.cos(a), wx = -d.hy, wy = d.hx;
      const at = (u, v, t) => [d.x + u * wx + v * d.hx * s - t * d.hx * c, d.y + u * wy + v * d.hy * s - t * d.hy * c, v * c + t * s];
      const q = slab(P, V, at, ring, inner, T), show = q.tn === 0;
      D.el.sil.setAttribute("d", q.sil);
      D.el.cr.setAttribute("d", q.crease);
      D.line.setAttribute("d", show ? seg(P(...at(-WD / 2 + 2.2, H / 2, 0)), P(...at(WD / 2 - 2.2, H / 2, 0))) : "");
      D.pips.forEach((p) => {
        const u = ((p.k % 3) - 1) * 3.4, v = (p.half ? H / 4 : (3 * H) / 4) + (1 - Math.floor(p.k / 3)) * 3.4;
        p.c.setAttribute("r", show ? 0.85 : 0);
        place(p.c, P(...at(u, v, 0)));
      });
    });
    const k = clamp(Math.floor(F), 0, N - 1);
    if (k !== pick) { pick = k; doms.forEach((D, i) => D.el.sil.classList.toggle("hi", i === k)); }
  }

  const B = register(stage, (dt) => { const m = stepS(sp, dt); draw(); return m; });
  bag.add(B.unregister);

  // the run's front from screen x, between the resting feet of the first and last
  let ends = [];
  const measure = () => { ends = [P(row[0].x, row[0].y, 0)[0] - 10, P(row[N - 1].x, row[N - 1].y, 0)[0] + 14]; };
  measure();
  const down = (F) => Math.min(N, Math.floor(F + 0.02));

  bag.add(pointer(stage, {
    move: ([sx]) => {
      sp.t = clamp(((sx - ends[0]) / (ends[1] - ends[0])) * N, 0, N);
      read.textContent = `${down(sp.t)} down`;
      B.wake();
    },
    leave: () => { sp.t = F0; read.textContent = "rest"; B.wake(); },
  }));
  bag.add(() => svg.replaceChildren());

  return {
    set: (v) => { G = v; row = layout(G); measure(); doms.forEach((D) => { D.drawn = NaN; }); lastF = NaN; B.wake(); },
    destroy: bag.dispose,
  };
}

hairline({
  name: "dominoes",
  means: "An arc of dominoes: the pointer runs the fall along the row, and the fallen ones lie shingled on each other.",
  rules: [1, 3, 5, 9],
  range: [12, 16, 20],
  mount,
});
})();
